<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #eef2ff; --bg2: #f8fafc;
      --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --primary: #4f46e5; --primary-d: #4338ca; --primary-l: #eef2ff;
      --ok: #15803d; --ok-bg: #f0fdf4;
      --err: #b91c1c; --err-bg: #fef2f2;
      --warn: #92400e; --warn-bg: #fffbeb;
      --online: #2563eb; --online-bg: #eff6ff;
      --onsite: #059669; --onsite-bg: #ecfdf5;
      --radius: 16px;
      /* >>> วาง base64 โลโก้ของคุณแทนข้อความ "วางโลโก้ของคุณตรงนี้" (ให้เหลือรูปแบบ url("data:image/webp;base64,....")) <<< */
      --logo: url("data:image/webp;base64,วางโลโก้ของคุณตรงนี้");
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); min-height: 100vh;
      font-family: 'Prompt', 'Noto Sans Thai', -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2) 320px);
    }
    button { font-family: inherit; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
    .wrap.center { padding-top: 48px; }

    /* ---------- ปุ่ม ---------- */
    .btn {
      display: block; width: 100%; border: 0; border-radius: 12px;
      padding: 14px 16px; font-size: 16px; font-weight: 500; cursor: pointer;
      transition: transform .05s, box-shadow .2s;
    }
    .btn.primary {
      color: #fff; background: linear-gradient(135deg, var(--primary), #6366f1);
      box-shadow: 0 6px 16px rgba(79, 70, 229, .3);
    }
    .btn.primary:active { transform: translateY(1px); }
    .btn:disabled { opacity: .6; cursor: progress; box-shadow: none; }
    .btn:focus-visible, .cal-day:focus-visible, .cal-nav:focus-visible, .mini:focus-visible, .tab:focus-visible,
    .gbtn:focus-visible, .lk-back:focus-visible {
      outline: 3px solid rgba(79, 70, 229, .4); outline-offset: 2px;
    }

    /* ---------- หน้า login ---------- */
    .card {
      background: #fff; border-radius: 20px; padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(79, 70, 229, .12);
    }
    .logo-img {
      width: 150px; aspect-ratio: 158 / 82; margin: 0 auto 10px;
      background: var(--logo) center / contain no-repeat;
    }
    .center-text { text-align: center; }
    .brand-name { font-weight: 600; font-size: 18px; }
    .sub { color: var(--muted); font-size: 14px; margin: 4px 0 20px; }
    .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 13px 14px; margin-bottom: 16px; font-size: 16px;
      font-family: inherit; border: 1.5px solid var(--line); border-radius: 12px;
      background: #f8fafc; color: var(--ink);
    }
    .field input:focus {
      outline: none; border-color: var(--primary); background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .15);
    }

    /* ---------- กล่องข้อความ ---------- */
    .msgbox { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
    .msgbox.ok { background: var(--ok-bg); color: var(--ok); }
    .msgbox.err { background: var(--err-bg); color: var(--err); }
    .msgbox.info { background: var(--online-bg); color: var(--online); }

    /* ---------- ส่วนหัวหน้าหลัก ---------- */
    .hero {
      position: relative; color: #fff; border-radius: 20px; padding: 22px 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 10px 24px rgba(79, 70, 229, .3);
    }
    .hero .brand { font-size: 12px; letter-spacing: .08em; opacity: .85; text-transform: uppercase; }
    .hero h2 { margin: 6px 0 0; font-size: 22px; font-weight: 600; padding-right: 96px; word-break: break-word; }
    .hero .out {
      position: absolute; top: 14px; right: 14px; border: 0; cursor: pointer;
      background: rgba(255, 255, 255, .2); color: #fff; border-radius: 999px;
      padding: 6px 12px; font-size: 13px;
    }

    /* ---------- แท็บนำทาง ---------- */
    .layout { margin-top: 16px; }
    .nav {
      display: flex; gap: 6px; padding: 6px; background: #fff;
      border-radius: 14px; box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .tab {
      flex: 1; border: 0; background: transparent; color: var(--muted);
      padding: 11px 8px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .tab.active { background: var(--primary-l); color: var(--primary-d); }
    .pages { margin-top: 14px; }

    @media (min-width: 768px) {
      .wrap.wide { max-width: 920px; }
      .layout { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; }
      .nav { flex-direction: column; position: sticky; top: 16px; padding: 10px; }
      .tab { flex: none; text-align: left; padding: 13px 14px; }
      .pages { margin-top: 0; }
    }

    .panel {
      background: #fff; border-radius: var(--radius); padding: 16px; margin-top: 14px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .sec { margin: 26px 4px 6px; font-size: 16px; font-weight: 600; }
    .sec.first { margin-top: 4px; }
    .hint { font-size: 14px; color: var(--muted); }

    /* ---------- ลิงก์แบบแบ่งหมวด ---------- */
    .lk-groups .gbtn {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      width: 100%; margin-top: 8px; padding: 14px; text-align: left; cursor: pointer;
      background: #fff; color: var(--ink); border: 2px solid var(--line);
      border-radius: 14px; font-size: 16px; font-weight: 500;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
    }
    .lk-groups .gbtn:first-child { margin-top: 0; }
    .gbtn::after { content: '›'; font-size: 22px; color: var(--primary); }
    .gbtn.active { border-color: var(--primary); background: var(--primary-l); color: var(--primary-d); }
    .lk-groups .nbtn { display: none; }
    .lk-groups .nbtn + .gbtn { margin-top: 0; }

    .lk.picked .lk-items { display: block; }
    .lk.picked .lk-groups { display: none; }
    .lk-head { display: flex; align-items: center; gap: 10px; margin: 0 2px 4px; }
    .lk-back {
      width: auto; padding: 6px 12px; border: 0; border-radius: 10px;
      background: #e2e8f0; color: #334155; font-size: 14px; cursor: pointer;
    }
    .lk-title { font-weight: 600; font-size: 17px; }
    .lk-items a.link:first-of-type { margin-top: 8px; }
    .lk-note {
      margin-top: 12px; padding: 14px 16px; background: #fff; border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
      font-size: 14px; line-height: 1.75; white-space: pre-line; overflow-wrap: break-word;
    }

    @media (min-width: 768px) {
      .lk { display: grid; grid-template-columns: 190px 1fr; gap: 16px; align-items: start; }
      .lk .lk-items, .lk.picked .lk-items { display: block; }
      .lk.picked .lk-groups { display: block; }
      .lk-back { display: none; }
      .lk.single { display: block; }
      .lk.single .lk-groups { display: none; }
      .lk-note:first-child { margin-top: 0; }
      .lk-groups .nbtn { display: flex; }
      .lk-groups .nbtn + .gbtn { margin-top: 8px; }
    }

    /* ---------- ขั้นตอนการจอง ---------- */
    .step { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 4px 0 10px; }
    .step .num {
      width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary); color: #fff;
    }
    .step small { font-weight: 400; color: var(--muted); font-size: 13px; }
    .step.second { margin-top: 18px; }

    /* ---------- ปฏิทิน ---------- */
    .cal { background: #f8faff; border-radius: 16px; padding: 12px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
    .cal-title { font-size: 16px; font-weight: 500; }
    .cal-nav {
      width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent;
      font-size: 22px; color: var(--ink); cursor: pointer;
    }
    .cal-nav:hover:not(:disabled) { background: var(--primary-l); }
    .cal-nav:disabled { opacity: .3; cursor: default; }
    .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .cal-dow span { font-size: 12px; color: var(--muted); padding: 6px 0; }
    .cal-day {
      position: relative; border: 0; background: transparent; font-size: 15px; color: #94a3b8;
      width: 100%; max-width: 44px; aspect-ratio: 1; margin: 2px auto; border-radius: 50%; cursor: default;
    }
    .cal-day.has { color: var(--primary-d); background: var(--primary-l); font-weight: 600; cursor: pointer; }
    .cal-day.has.booked, .cal-day.has.full { background: #e2e8f0; color: #64748b; }
    .cal-day.has.sel { background: var(--primary-l); box-shadow: inset 0 0 0 2px var(--primary); }
    .cal-day.has.active { background: var(--primary); color: #fff; }
    .cal-day.today:not(.active)::after {
      content: ''; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px;
      margin-left: -2px; border-radius: 50%; background: currentColor;
    }
    .cal-detail {
      margin-top: 12px; padding: 14px; border: 2px solid var(--primary); border-radius: 14px; background: #fff;
    }
    .cal-detail .d-date { font-size: 13px; color: var(--muted); }
    .cal-detail .d-lesson { font-size: 18px; font-weight: 600; line-height: 1.35; margin-top: 2px; overflow-wrap: break-word; }
    .cal-detail .d-time { margin-top: 8px; font-size: 15px; font-weight: 500; color: var(--primary-d); }
    .cal-detail .btn { margin-top: 12px; padding: 11px 14px; font-size: 15px; }
    .cal-detail .btn.ghost { background: #e2e8f0; color: #334155; }
    .c-seat {
      display: inline-block; margin-top: 8px; font-size: 12px; padding: 2px 8px;
      border-radius: 999px; background: var(--ok-bg); color: var(--ok);
    }
    .c-seat.low { background: var(--warn-bg); color: var(--warn); }
    .c-seat.off { background: #e2e8f0; color: #64748b; }
    .cal-hint { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
    .cal-picked { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .cal-picked .tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px;
      border-radius: 999px; background: var(--primary-l); color: var(--primary-d); font-size: 14px; font-weight: 500;
    }
    .tag button { border: 0; background: rgba(79,70,229,.15); color: var(--primary-d); width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }

    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { position: relative; display: block; cursor: pointer; }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt span {
      display: block; text-align: center; padding: 12px 8px; font-weight: 500;
      border: 2px solid var(--line); border-radius: 14px; background: #fff;
    }
    .opt small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .opt input:checked + span { border-color: var(--primary); background: var(--primary-l); color: var(--primary-d); }
    .opt input:focus-visible + span { outline: 3px solid rgba(79, 70, 229, .4); outline-offset: 2px; }
    #submitBook { margin-top: 18px; }

    /* ---------- นัดของฉัน ---------- */
    .appt {
      display: flex; gap: 12px; margin-top: 10px; padding: 12px;
      background: #fff; border-radius: var(--radius); border-left: 4px solid var(--online);
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .appt.onsite { border-left-color: var(--onsite); }
    .tile {
      flex: 0 0 56px; text-align: center; border-radius: 12px; padding: 8px 0;
      background: var(--online-bg); color: var(--online); align-self: flex-start;
    }
    .appt.onsite .tile { background: var(--onsite-bg); color: var(--onsite); }
    .tile b { display: block; font-size: 22px; line-height: 1.1; }
    .tile span { display: block; font-size: 12px; text-transform: uppercase; }
    .abody { flex: 1; min-width: 0; }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 10px;
      border-radius: 999px; background: var(--online-bg); color: var(--online);
    }
    .appt.onsite .badge { background: var(--onsite-bg); color: var(--onsite); }
    .year { font-size: 12px; color: var(--muted); margin-left: 6px; }
    .pill {
      display: inline-block; margin: 8px 6px 0 0; padding: 7px 12px; border-radius: 999px;
      font-size: 14px; font-weight: 500; text-decoration: none;
      background: var(--primary-l); color: var(--primary-d);
    }
    .lesson { margin-top: 8px; font-size: 14px; }
    .ltitle { margin-top: 8px; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: break-word; }
    .atime { margin-top: 4px; font-size: 14px; font-weight: 500; color: var(--primary-d); }
    .wait {
      margin-top: 8px; font-size: 13px; color: var(--warn); background: var(--warn-bg);
      padding: 6px 10px; border-radius: 10px;
    }
    .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .mini {
      display: inline-block; width: auto; margin: 10px 8px 0 0; padding: 7px 14px;
      border: 0; border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    .mini.cancel { background: var(--err-bg); color: var(--err); }

    /* ---------- ประวัติการจอง (นัดที่ผ่านไปแล้ว) ---------- */
    .appt.past { opacity: .8; border-left-color: #94a3b8; }
    .appt.past .tile { background: #f1f5f9; color: #64748b; }
    .appt.past .badge { background: #f1f5f9; color: #64748b; }
    .done-tag { font-size: 12px; color: var(--muted); margin-left: 6px; }
    .mini.hist-more { display: block; width: 100%; margin: 10px 0 0; text-align: center; background: #e2e8f0; color: #334155; }

    /* ---------- ลิงก์ (รายการ) ---------- */
    a.link {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-top: 8px; padding: 14px; background: #fff; color: var(--ink);
      border: 1px solid var(--line); border-radius: 14px; text-decoration: none;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
    }
    a.link::after { content: '›'; font-size: 22px; color: var(--primary); }
    a.link:active { background: var(--primary-l); }

    /* ---------- ป๊อปอัปแบบหน้าต่างเกม ---------- */
    .dlg-overlay {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(15, 23, 42, .45);
    }
    .dlg-overlay.open { display: flex; animation: dlgFade .15s ease-out; }
    .dlg-overlay.closing { animation: dlgFadeOut .15s ease-in forwards; }
    .dlg-win {
      width: 100%; max-width: 360px; background: #fff; overflow: hidden;
      border: 2.5px solid var(--ink); border-radius: 14px;
      box-shadow: 6px 6px 0 rgba(15, 23, 42, .9);
      animation: dlgPop .3s cubic-bezier(.2, 1.4, .4, 1);
    }
    .dlg-overlay.closing .dlg-win { animation: dlgPopOut .15s ease-in forwards; }
    .dlg-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: var(--ink); color: #fff;
      font-size: 14px; font-weight: 500;
    }
    .dlg-content { padding: 20px 18px 18px; text-align: center; }
    .dlg-icon { font-size: 34px; line-height: 1; }
    .dlg-body { margin-top: 10px; font-size: 15px; line-height: 1.6; word-break: break-word; }
    .dlg-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
    .dlg-list span {
      padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 500;
      background: var(--primary-l); color: var(--primary-d);
    }
    .dlg-actions { display: flex; gap: 10px; margin-top: 18px; }
    .dlg-actions .btn { width: auto; flex: 1; padding: 12px 8px; font-size: 15px; }
    .btn.ghost { background: #e2e8f0; color: #334155; }
    .btn.danger { color: #fff; background: #dc2626; box-shadow: 0 6px 16px rgba(220, 38, 38, .25); }
    .dlg-note { margin-top: 10px; font-size: 14px; color: var(--muted); }
    .dlg-link {
      display: inline-block; margin-top: 10px; padding: 7px 14px; border-radius: 999px;
      font-size: 14px; font-weight: 500; text-decoration: none;
      background: var(--primary-l); color: var(--primary-d);
    }

    @keyframes dlgFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dlgFadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes dlgPop {
      from { opacity: 0; transform: scale(.6) translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes dlgPopOut {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: scale(.9) translateY(8px); }
    }

    /* ---------- ข้อความต้อนรับ ---------- */
    .hw { display: inline-block; white-space: nowrap; }
    .hl {
      display: inline-block; border-radius: 6px;
      animation: hlIn .5s cubic-bezier(.2, 1.3, .4, 1) both;
    }
    .hwave { display: inline-block; animation: emojiIn .6s cubic-bezier(.2, 1.3, .4, 1) both; }
    @keyframes hlIn {
      0% { opacity: 0; transform: translateY(-12px) rotate(-60deg) scale(.5);
           box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .9); background: rgba(255, 255, 255, .25); }
      55% { opacity: 1; transform: translateY(1px) rotate(6deg) scale(1.08);
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .18); }
      100% { opacity: 1; transform: none;
             box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0); background: rgba(255, 255, 255, 0); }
    }
    @keyframes emojiIn {
      0% { opacity: 0; transform: scale(.3) rotate(-30deg); }
      60% { opacity: 1; transform: scale(1.2) rotate(15deg); }
      100% { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dlg-overlay.open, .dlg-overlay.closing, .dlg-win, .dlg-overlay.closing .dlg-win,
      .hl, .hwave { animation: none; }
    }

    /* ---------- หน้า login: ฉากหลังเคลื่อนไหว + การ์ดเรืองแสง ---------- */
    @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .fx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .fx::before {
      content: ''; position: absolute; inset: -40px;
      background-image: linear-gradient(rgba(79,70,229,.07) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(79,70,229,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      animation: gridMove 8s linear infinite;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55;
           animation: orbDrift 14s ease-in-out infinite alternate; }
    .orb.o1 { width: 380px; height: 380px; background: #a5b4fc; top: -100px; left: -80px; }
    .orb.o2 { width: 340px; height: 340px; background: #c4b5fd; bottom: -90px; right: -70px;
              animation-duration: 18s; animation-delay: -4s; }
    .orb.o3 { width: 260px; height: 260px; background: #7dd3fc; top: 45%; left: 55%; opacity: .4;
              animation-duration: 16s; animation-delay: -8s; }
    .sym { position: absolute; bottom: -60px; color: var(--primary); font-weight: 600; opacity: 0;
           animation: symFloat linear infinite; }
    @keyframes gridMove { to { transform: translate(40px, 40px); } }
    @keyframes orbDrift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 40px) scale(1.15); } }
    @keyframes symFloat {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%, 90% { opacity: .18; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    #loginCard { position: relative; z-index: 1; }
    .card.glow {
      isolation: isolate; background: transparent;
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .15s ease-out;
    }
    .card.glow::before {
      content: ''; position: absolute; inset: -2px; border-radius: 22px; z-index: -2;
      background: conic-gradient(from var(--ang), #4f46e5, #7c3aed, #38bdf8, #a78bfa, #4f46e5);
      animation: angSpin 5s linear infinite;
    }
    .card.glow::after { content: ''; position: absolute; inset: 0; border-radius: 20px; background: #fff; z-index: -1; }
    @keyframes angSpin { to { --ang: 360deg; } }

    .brand-name {
      background: linear-gradient(90deg, var(--ink) 0 35%, #7c3aed 50%, var(--ink) 65% 100%);
      background-size: 250% 100%; background-position: 100% 0;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: shine 4s linear infinite;
    }

<script>
// ---------- ตั้งค่า Supabase ----------
const SB_URL = 'https://apzntujfqhzadgejdpwf.supabase.co';
const SB_KEY = 'sb_publishable_6hPDr97QyuYA9gX8qCRYqw_cKQPhSGq';

const RPC = {
  login:             { name: 'app_login',  params: ['p_student_id', 'p_email'] },
  bookAppointment:   { name: 'app_book',   params: ['p_token', 'p_dates', 'p_type'] },
  cancelAppointment: { name: 'app_cancel', params: ['p_token', 'p_date'] },
  logout:            { name: 'app_logout', params: ['p_token'] },
  status:            { name: 'app_status', params: [] }
};

function callRpc(fn, args) {
  const def = RPC[fn];
  const body = {};
  def.params.forEach(function (p, i) { body[p] = args[i]; });

  const headers = { 'Content-Type': 'application/json', apikey: SB_KEY };
  if (/^eyJ/.test(SB_KEY)) headers.Authorization = 'Bearer ' + SB_KEY;

  return fetch(SB_URL + '/rest/v1/rpc/' + def.name, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (data) {
      if (!r.ok) {
        const e = new Error((data && data.message) || ('HTTP ' + r.status));
        e.status = r.status;
        throw e;
      }
      return data;
    });
  });
}
let token = '';
let slots = [];
let appts = [];
let selected = {};
let busy = false;
let linkGroups = [];
let currentGroup = -1;
let linkNotes = [];
let onsite = { place: '', mapUrl: '' };

const BOOK_LABEL = '📅 จองนัด Checkpoint กับพี่ๆ';
const TIME_TEXT = '16:30 - 18:30';

let calY = 0, calM = -1, calDay = '';

const HIST_SHOW = 5;   // ประวัติแสดงเริ่มต้นกี่รายการ
const HIST_MAX = 10;   // กด "ดูเพิ่ม" แล้วแสดงได้สูงสุดกี่รายการ (ให้ตรงกับ limit ใน SQL)

function $(id) { return document.getElementById(id); }

function isHttps(u) {
  return /^https:\/\//i.test(String(u || ''));
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function softText(el, text) {
  el.textContent = '';
  String(text).split(/([&\/\-_+,:]+)/).forEach(function (part, i) {
    if (!part) return;
    el.appendChild(document.createTextNode(part));
    if (i % 2 === 1) el.appendChild(document.createElement('wbr'));
  });
}

function setBox(id, text, cls) {
  const m = $(id);
  m.className = text ? 'msgbox ' + (cls || '') : '';

}
function setBMsg(text, cls) { setBox('bmsg', text, cls); }

/* ---------- เรียกเซิร์ฟเวอร์ พร้อมลองใหม่อัตโนมัติ ---------- */
function runRetry(fn, args, opt) {
  const maxFail = opt.maxFail || 4;
  const maxBusy = opt.maxBusy || 12;
  let fails = 0;
  let busies = 0;

  function pause(n) {
    return Math.min(1200 + n * 600, 5000) + Math.random() * 1500;
  }

  function go() {
    callRpc(fn, args).then(function (res) {
      if (res && res.busy) {
        busies++;
        if (busies <= maxBusy) {
          if (opt.onWait) opt.onWait(fails + busies);
          setTimeout(go, pause(fails + busies));
          return;
        }
        opt.done({ ok: false, busyGiveUp: true }, null);
        return;
      }
      opt.done(res, null);
    }, function (err) {
      const retryable = !err.status || err.status >= 500 || err.status === 429;
      fails++;
      if (retryable && fails <= maxFail) {
        if (opt.onWait) opt.onWait(fails + busies);
        setTimeout(go, pause(fails + busies));
        return;
      }
      opt.done(null, err);
    });
  }

  go();
}

/* ---------- สลับแท็บ ---------- */

}

/* ---------- ป๊อปอัป ---------- */
let dlgLastFocus = null;
let dlgTimer = null;

function showDialog(o) {
  const ov = $('dlg');
  clearTimeout(dlgTimer);
  if (!ov.classList.contains('open')) dlgLastFocus = document.activeElement;
  ov.classList.remove('closing');

  $('dlgTitle').textContent = o.title || '';
  $('dlgIcon').textContent = o.icon || '';

  const body = $('dlgBody');
  body.textContent = '';
  if (o.message) {
    const p = document.createElement('div');
    p.textContent = o.message;
    body.appendChild(p);
  }
  if (o.lines && o.lines.length) {
    const l = document.createElement('div');
    l.className = 'dlg-list';
    o.lines.forEach(function (t) {
      const s = document.createElement('span');
      s.textContent = t;
      l.appendChild(s);
    });
    body.appendChild(l);
  }
  if (o.note) {
    const n = document.createElement('div');
    n.className = 'dlg-note';
    n.textContent = o.note;
    body.appendChild(n);
  }
  if (o.link && isHttps(o.link.href)) {
    const a = document.createElement('a');
    a.className = 'dlg-link';
    a.href = o.link.href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = o.link.text;
    body.appendChild(a);
  }

  const act = $('dlgActions');
  act.textContent = '';
  let focusBtn = null;
  (o.buttons || []).forEach(function (bt, i) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + (bt.cls || 'primary');
    b.textContent = bt.text;
    b.onclick = function () {
      closeDialog();
      if (bt.onClick) bt.onClick();
    };
    act.appendChild(b);
    if (bt.focus || (!focusBtn && i === 0)) focusBtn = b;
  });

  ov.classList.add('open');
  if (focusBtn) focusBtn.focus();
}

function closeDialog(immediate) {
  const ov = $('dlg');
  if (!ov.classList.contains('open')) return;
  clearTimeout(dlgTimer);
  function finish() {
    ov.classList.remove('open', 'closing');
    try { if (dlgLastFocus && dlgLastFocus.focus) dlgLastFocus.focus(); } catch (e) {}
    dlgLastFocus = null;
  }
  if (immediate) { finish(); return; }
  ov.classList.add('closing');
  dlgTimer = setTimeout(finish, 160);
}

$('dlg').addEventListener('click', function (e) {
  if (e.target === $('dlg')) closeDialog();
});

document.addEventListener('keydown', function (e) {
  const ov = $('dlg');
  if (!ov.classList.contains('open') || ov.classList.contains('closing')) return;
  if (e.key === 'Escape') { closeDialog(); return; }
  if (e.key === 'Tab') {
    const bs = ov.querySelectorAll('button, a[href]');
    if (!bs.length) return;
    const first = bs[0], last = bs[bs.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- ข้อความต้อนรับ ---------- */
function splitChars(s) {
  try {
    if (window.Intl && Intl.Segmenter) {
      return Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s),
        function (x) { return x.segment; });
    }
  } catch (e) {}
  return s.match(/[^\u0E31\u0E34-\u0E3A\u0E47-\u0E4E][\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]*|[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]+/gu) || [s];
}

function welcome(name) {
  const h = $('hello');
  h.textContent = '';
  h.setAttribute('aria-label', 'สวัสดี ' + name);

  let i = 0;

}

// ตรวจว่าคำตอบจากเซิร์ฟเวอร์คือ "ปิดปรับปรุง"
function isMaint(res) {

}

// แสดงหน้าปิดปรับปรุงเต็มจอ (พร้อมออกจากระบบและล้างข้อมูลในหน้า)

// เช็กสถานะปิดปรับปรุงตั้งแต่เปิดหน้า และเช็กซ้ำทุก 60 วินาที

  }).catch(function () {}); // เช็กไม่ได้ก็ไม่ต้องทำอะไร (ฝั่งล็อกอิน/จองยังบล็อกให้อยู่)

/* ---------- Login ---------- */
function doLogin() {
  const btn = $('btn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';
  setBox('msg', '');

  runRetry('login', [$('sid').value, $('email').value], {
    maxFail: 4,

      setBox('msg', 'ตอนนี้มีผู้ใช้งานจำนวนมาก กำลังลองเชื่อมต่ออีกครั้ง (' + n + ')...', 'info');
    },
    done: function (res, err) {
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
      if (err || !res || res.busyGiveUp) {
        setBox('msg', 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่อีกครั้งในอีกสักครู่', 'err');
        return;

      if (isMaint(res)) { showMaintenance(res.message); return; }

/* ---------- ลิงก์ (แบ่งหมวด) ---------- */
function buildGroups(links) {
  const order = [];
  const map = Object.create(null);
  (links || []).forEach(function (l) {
    if (!isHttps(l.url)) return;
    const g = String(l.group || '').trim() || 'อื่นๆ';
    if (!(g in map)) { map[g] = []; order.push(g); }
    map[g].push({ title: l.title, url: l.url });
  });
  return order.map(function (g) { return { name: g, items: map[g] }; });
}

function renderLinks(links, notes) {
  linkNotes = notes || [];
  linkGroups = buildGroups(links);
  currentGroup = linkGroups.length === 1 ? 0 : -1;
  drawLinks();
}

  const lk = $('lk');

  if (!linkGroups.length) {
    const p = document.createElement('div');
    p.className = 'hint';
    p.textContent = 'ยังไม่มีลิงก์ในตอนนี้';
    groupsBox.appendChild(p);
    return;
  }

  if (linkNotes.length && linkGroups.length > 1) {
    const nb = document.createElement('button');
    nb.type = 'button';
    nb.className = 'gbtn nbtn' + (currentGroup < 0 ? ' active' : '');
    const nt = document.createElement('span');
    nt.textContent = '📌 ข้อแนะนำ';
    nb.appendChild(nt);
    nb.onclick = function () { currentGroup = -1; drawLinks(); };
    groupsBox.appendChild(nb);
  }

  linkGroups.forEach(function (g, i) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'gbtn' + (i === currentGroup ? ' active' : '');
    const n = document.createElement('span');
    n.textContent = g.name;
    b.appendChild(n);
    b.onclick = function () { currentGroup = i; drawLinks(); };
    groupsBox.appendChild(b);
  });

  if (currentGroup < 0) {
    if (linkNotes.length) {
      linkNotes.forEach(function (n) {
        const c = document.createElement('div');
        c.className = 'lk-note';
        c.textContent = n;
        itemsBox.appendChild(c);
      });
    } else {
      const p = document.createElement('div');
      p.className = 'hint';
      p.textContent = 'เลือกหมวดเพื่อดูลิงก์';
      itemsBox.appendChild(p);
    }
    return;
  }

  const g = linkGroups[currentGroup];
  if (linkGroups.length > 1) {
    const head = document.createElement('div');
    head.className = 'lk-head';
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'lk-back';
    back.textContent = '‹ กลับ';
    back.onclick = function () { currentGroup = -1; drawLinks(); };
    head.appendChild(back);
    const t = document.createElement('div');
    t.className = 'lk-title';
    t.textContent = g.name;
    head.appendChild(t);
    itemsBox.appendChild(head);
  }
  g.items.forEach(function (it) {
    const a = document.createElement('a');
    a.className = 'link';
    a.href = it.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = it.title;
    itemsBox.appendChild(a);
  });
}

/* ---------- นัดของฉัน ---------- */
function miniButton(text, cls, onclick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mini ' + cls;
  b.textContent = text;
  b.onclick = onclick;
  return b;
}

function waitLine(text) {
  const d = document.createElement('div');
  d.className = 'wait';
  d.textContent = '⏳ ' + text;
  return d;
}

function pill(href, text) {
  const a = document.createElement('a');
  a.className = 'pill';
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = text;
  return a;
}

function dateParts(label) {
  const p = String(label).split('/');
  return p.length === 3 ? { d: p[0], m: p[1], y: p[2] } : { d: String(label), m: '', y: '' };
}

// วันนี้ตามเวลาไทย รูปแบบ yyyy-mm-dd
function todayBkk() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
}

function buildApptCard(a, isPast) {
  const p = dateParts(a.label);
  const isOnline = a.type === 'online';

  const card = document.createElement('div');
  card.className = 'appt ' + (isOnline ? 'online' : 'onsite') + (isPast ? ' past' : '');

  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.appendChild(el('b', '', p.d));
  tile.appendChild(el('span', '', p.m));
  card.appendChild(tile);

  const body = document.createElement('div');
  body.className = 'abody';

  const head = document.createElement('div');
  head.appendChild(el('span', 'badge', isOnline ? 'Online' : 'Onsite'));
  if (p.y) head.appendChild(el('span', 'year', p.y));
  if (isPast) head.appendChild(el('span', 'done-tag', '• ผ่านไปแล้ว'));
  body.appendChild(head);

  if (a.lesson) {
    const l = document.createElement('div');
    l.className = 'ltitle';
    softText(l, a.lesson);
    body.appendChild(l);
  }

  body.appendChild(el('div', 'atime', '🕓 ' + TIME_TEXT));

  if (isPast) {
    // ประวัติ: โชว์เฉพาะเอกสารที่มีลิงก์จริง ไม่โชว์ปุ่มยกเลิก/ข้อความเตือน
    if (isHttps(a.doc)) body.appendChild(pill(a.doc, '📄 เอกสารประกอบบทเรียน'));
    card.appendChild(body);
    return card;
  }

  if (isOnline) {
    if (isHttps(a.link)) body.appendChild(pill(a.link, '👉 Link นัดหมาย online'));
    else body.appendChild(waitLine('Link นัดหมาย online จะมีให้ในวันนั้น'));
  } else {
    if (onsite.place) body.appendChild(el('div', 'lesson', '📍 สถานที่: ' + onsite.place));
    if (isHttps(onsite.mapUrl)) body.appendChild(pill(onsite.mapUrl, '🗺️ เปิดแผนที่'));
    body.appendChild(el('div', 'note', 'อย่าลืมมาตามนัดนะ'));
  }

  if (isHttps(a.doc)) body.appendChild(pill(a.doc, '📄 เอกสารประกอบบทเรียน'));
  else body.appendChild(waitLine('Link เอกสารประกอบบทเรียน จะมีให้ในวันนั้น'));

  const act = document.createElement('div');
  if (a.canCancel) {
    act.appendChild(miniButton('ยกเลิกนัด', 'cancel', function () {
      setAMsg('');
      askCancel(a);
    }));
  } else {
    act.appendChild(el('div', 'note', 'ถึงวันนัดแล้ว ยกเลิกในเว็บไม่ได้ กรุณาติดต่อพี่ๆ'));
  }
  body.appendChild(act);

  card.appendChild(body);
  return card;
}

function renderAppts() {
  const box = $('apptBox');
  box.textContent = '';
  if (!appts.length) return;

  const today = todayBkk();
  const upcoming = appts.filter(function (a) { return a.key >= today; })
                        .sort(function (x, y) { return x.key < y.key ? -1 : 1; });
  const history = appts.filter(function (a) { return a.key < today; })
                       .sort(function (x, y) { return x.key < y.key ? 1 : -1; }) // ใหม่ -> เก่า
                       .slice(0, HIST_MAX);

  if (upcoming.length) {
    box.appendChild(el('div', 'sec', 'นัดของฉัน'));
    upcoming.forEach(function (a) { box.appendChild(buildApptCard(a, false)); });
  }

  if (history.length) {
    box.appendChild(el('div', 'sec', 'ประวัติการจอง'));
    const shown = histOpen ? history : history.slice(0, HIST_SHOW);
    shown.forEach(function (a) { box.appendChild(buildApptCard(a, true)); });

    if (history.length > HIST_SHOW) {
      box.appendChild(miniButton(
        histOpen ? 'ย่อประวัติ' : 'ดูเพิ่ม (อีก ' + (history.length - HIST_SHOW) + ' รายการ)',
        'hist-more',
        function () { histOpen = !histOpen; renderAppts(); }
      ));
    }
  }
}

/* ---------- ปฏิทินเลือกวันที่ ---------- */
function renderChips() {
  const box = $('slotList');
  box.textContent = '';
  if (!slots.length) {
    box.appendChild(el('div', 'hint', 'ตอนนี้ยังไม่มีวันที่เปิดให้จอง'));
    return;
  }

  const byKey = {}, booked = {};
  slots.forEach(function (s) { byKey[s.key] = s; });
  appts.forEach(function (a) { booked[a.key] = true; });
  Object.keys(selected).forEach(function (k) {
    if (!byKey[k] || booked[k] || byKey[k].full) delete selected[k];
  });

  const keys = slots.map(function (s) { return s.key; }).sort();
  const minYM = keys[0].slice(0, 7), maxYM = keys[keys.length - 1].slice(0, 7);
  if (calM < 0) {
    const f = Object.keys(selected).sort()[0] || keys[0];
    calY = +f.slice(0, 4); calM = +f.slice(5, 7) - 1;
  }
  const ym = calY + '-' + pad2(calM + 1);

  const cal = el('div', 'cal');
  const head = el('div', 'cal-head');
  const prev = el('button', 'cal-nav', '‹'); prev.type = 'button';
  const next = el('button', 'cal-nav', '›'); next.type = 'button';
  prev.setAttribute('aria-label', 'เดือนก่อนหน้า');
  next.setAttribute('aria-label', 'เดือนถัดไป');
  prev.disabled = ym <= minYM;
  next.disabled = ym >= maxYM;
  prev.onclick = function () { calM--; if (calM < 0) { calM = 11; calY--; } renderChips(); };
  next.onclick = function () { calM++; if (calM > 11) { calM = 0; calY++; } renderChips(); };
  head.appendChild(prev);
  head.appendChild(el('div', 'cal-title', MONTHS[calM] + ' ' + calY));
  head.appendChild(next);
  cal.appendChild(head);

  const dow = el('div', 'cal-dow');
  ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(function (d) { dow.appendChild(el('span', '', d)); });
  cal.appendChild(dow);

  const grid = el('div', 'cal-grid');
  const first = new Date(calY, calM, 1).getDay();
  const total = new Date(calY, calM + 1, 0).getDate();
  const todayKey = (function () {
    const n = new Date();
    return n.getFullYear() + '-' + pad2(n.getMonth() + 1) + '-' + pad2(n.getDate());
  })();
  for (let i = 0; i < first; i++) grid.appendChild(el('span'));
  for (let d = 1; d <= total; d++) {
    const key = calY + '-' + pad2(calM + 1) + '-' + pad2(d);
    const s = byKey[key];
    const b = el('button', 'cal-day', String(d));
    b.type = 'button';
    if (key === todayKey) b.classList.add('today');
    if (s) {
      b.classList.add('has');
      if (booked[key]) b.classList.add('booked');
      else if (s.full) b.classList.add('full');
      if (selected[key]) b.classList.add('sel');
      if (key === calDay) b.classList.add('active');
      b.setAttribute('aria-pressed', key === calDay ? 'true' : 'false');
      b.onclick = function () { calDay = key; renderChips(); };
    } else {
      b.disabled = true;
    }
    grid.appendChild(b);
  }
  cal.appendChild(grid);
  box.appendChild(cal);

  const s = byKey[calDay];
  if (s) {
    const det = el('div', 'cal-detail');
    det.appendChild(el('div', 'd-date', '📅 ' + s.label));
    if (s.lesson) { const l = el('div', 'd-lesson'); softText(l, s.lesson); det.appendChild(l); }
    det.appendChild(el('div', 'd-time', '🕓 ' + TIME_TEXT));
    const isBooked = !!booked[s.key], isFull = !isBooked && s.full;
    const low = !isBooked && !isFull && s.left <= 5;
    det.appendChild(el('span', 'c-seat' + (low ? ' low' : '') + (isBooked || isFull ? ' off' : ''),
      isBooked ? '✓ จองแล้ว' : isFull ? 'เต็มแล้ว' : 'เหลือ ' + s.left + ' ที่นั่ง'));
    if (!isBooked && !isFull) {
      const act = el('button', 'btn ' + (selected[s.key] ? 'ghost' : 'primary'),
        selected[s.key] ? 'ยกเลิกการเลือกวันนี้' : 'เลือกวันนี้');
      act.type = 'button';
      act.onclick = function () { toggleDate(s.key); };
      det.appendChild(act);
    }
    box.appendChild(det);
  } else {
    box.appendChild(el('div', 'cal-hint', 'กดวันที่ที่มีวงกลมสีเพื่อดูบทเรียนและเวลา'));
  }

  const picked = Object.keys(selected).sort();
  if (picked.length) {
    const wrap = el('div', 'cal-picked');
    picked.forEach(function (k) {
      const t = el('span', 'tag');
      t.appendChild(document.createTextNode(byKey[k].label));
      const x = el('button', '', '×'); x.type = 'button';
      x.setAttribute('aria-label', 'เอาวันที่ ' + byKey[k].label + ' ออก');
      x.onclick = function () { toggleDate(k); };
      t.appendChild(x);
      wrap.appendChild(t);
    });
    box.appendChild(wrap);
  }
}

function toggleDate(key) {
  if (selected[key]) delete selected[key]; else selected[key] = true;
  renderChips();
}

function toggleBook() {
  const b = $('bookBox');
  const open = b.style.display === 'none';
  b.style.display = open ? 'block' : 'none';
  $('openBook').textContent = open ? '✕ ปิดหน้าจองนัด' : BOOK_LABEL;
  if (open) { setBMsg(''); setAMsg(''); }
}

function closeBook() {
  $('bookBox').style.display = 'none';
  $('openBook').textContent = BOOK_LABEL;
  document.querySelectorAll('input[name=btype]').forEach(function (r) { r.checked = false; });
  setBMsg('');
}

function selectedType() {
  const r = document.querySelector('input[name=btype]:checked');
  return r ? r.value : '';
}

function labelFor(key) {
  for (let i = 0; i < appts.length; i++) if (appts[i].key === key) return appts[i].label;
  for (let j = 0; j < slots.length; j++) if (slots[j].key === key) return slots[j].label;
  return key;
}

function allBooked(keys, type, list) {
  return keys.every(function (k) {
    return list.some(function (a) { return a.key === k && a.type === type; });
  });
}

/* ---------- จอง / ยกเลิก ---------- */
function doBook() {
  const keys = Object.keys(selected).sort();
  const type = selectedType();
  if (!keys.length) { setBMsg('กรุณากดเลือกวันที่อย่างน้อย 1 วัน', 'err'); return; }
  if (!type) { setBMsg('กรุณาเลือก Onsite หรือ Online', 'err'); return; }
  setBMsg('');
  setAMsg('');

  showDialog({
    icon: type === 'online' ? '💻' : '🏫',
    title: 'ยืนยันการจอง',
    message: 'จองนัด ' + (type === 'online' ? 'Online' : 'Onsite') + ' จำนวน ' + keys.length + ' วัน เวลา ' + TIME_TEXT,
    lines: keys.map(labelFor),
    note: type === 'onsite' && onsite.place ? '📍 สถานที่: ' + onsite.place : '',
    buttons: [
      { text: 'แก้ไข', cls: 'ghost' },
      { text: 'ยืนยันจอง', cls: 'primary', focus: true, onClick: function () { submitBook(keys, type); } }
    ]
  });
}

function submitBook(keys, type) {
  const btn = $('submitBook');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'กำลังจอง...';
  setBMsg('');
  setAMsg('');

  runRetry('bookAppointment', [token, keys, type], {
    maxFail: 4,
    maxBusy: 12,
    onWait: function (n) {
      btn.textContent = 'กำลังต่อคิว... (' + n + ')';
      setBMsg('ตอนนี้มีคนจองจำนวนมาก ระบบกำลังต่อคิวให้ กรุณารอสักครู่และอย่าปิดหน้านี้', 'info');
    },
    done: function (res, err) {
      btn.disabled = false;
      btn.textContent = 'ยืนยันการจอง';

      if (err || !res) {
        setBMsg('เชื่อมต่อไม่สำเร็จ หากไม่แน่ใจว่าจองแล้วหรือยัง ให้ออกจากระบบแล้วเข้าใหม่เพื่อดู "นัดของฉัน"', 'err');
        return;
      }
      if (res.busyGiveUp) {
        setBMsg('ตอนนี้มีคนจองจำนวนมากมาก ยังต่อคิวไม่สำเร็จ กรุณากดยืนยันการจองอีกครั้งในอีกสักครู่', 'err');
        return;
      }
      if (isMaint(res)) { showMaintenance(res.message); return; }
      if (res.expired) { doLogout(res.message); return; }
      if (res.slots) slots = res.slots;
      if (res.appts) appts = res.appts;

      let ok = !!res.ok;
      let labels = res.labels;
      if (!ok && res.appts && allBooked(keys, type, res.appts)) {
        ok = true;
        labels = keys.map(labelFor);
      }

      if (!ok) {
        renderAppts();
        renderChips();
        setBMsg(res.message || 'จองไม่สำเร็จ ลองใหม่อีกครั้ง', 'err');
        return;
      }

      selected = {};
      calDay = '';
      closeBook();
      renderAppts();
      renderChips();
      const typeText = type === 'online' ? 'Online' : 'Onsite';
      let text = 'จองนัด ' + typeText + ' เรียบร้อย: ' + (labels || []).join(', ');
      if (type === 'onsite') text += ' อย่าลืมมาตามนัดนะ 🙂';
      text += ' ดูรายละเอียดได้ที่ "นัดของฉัน" ด้านล่าง';
      setAMsg(text, 'ok');
      try { $('amsg').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}

      showDialog({
        icon: '🎉',
        title: 'จองสำเร็จ',
        message: 'จองนัด ' + typeText + ' เรียบร้อยแล้ว' + (type === 'onsite' ? ' อย่าลืมมาตามนัดนะ 🙂' : ''),
        lines: labels || [],
        note: type === 'onsite' && onsite.place ? '📍 สถานที่: ' + onsite.place : '',
        link: type === 'onsite' ? { text: '🗺️ เปิดแผนที่', href: onsite.mapUrl } : null,
        buttons: [{ text: 'OK', cls: 'primary' }]
      });
    }
  });
}

function askCancel(a) {
  showDialog({
    icon: '🗑️',
    title: 'ยกเลิกนัด',
    message: 'ยกเลิกนัดวันที่ ' + a.label + ' (' + (a.type === 'online' ? 'Online' : 'Onsite') + ') ใช่ไหม?',
    buttons: [
      { text: 'ไม่ยกเลิก', cls: 'ghost', focus: true },
      { text: 'ยืนยันยกเลิก', cls: 'danger', onClick: function () { doCancel(a.key); } }
    ]
  });
}

function doCancel(key) {
  if (busy) return;
  busy = true;
  const label = labelFor(key);
  setAMsg('กำลังยกเลิก...', 'info');
  setBMsg('');

  runRetry('cancelAppointment', [token, key], {
    maxFail: 4,
    maxBusy: 12,
    onWait: function (n) {
      setAMsg('ตอนนี้มีผู้ใช้งานจำนวนมาก ระบบกำลังต่อคิวให้ (' + n + ')...', 'info');
    },
    done: function (res, err) {
      busy = false;
      if (err || !res) {
        setAMsg('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'err');
        return;
      }
      if (res.busyGiveUp) {
        setAMsg('ตอนนี้มีผู้ใช้งานจำนวนมากมาก ยังต่อคิวไม่สำเร็จ กรุณากดยกเลิกอีกครั้งในอีกสักครู่', 'err');
        return;
      }
      if (isMaint(res)) { showMaintenance(res.message); return; }
      if (res.expired) { doLogout(res.message); return; }
      if (res.slots) slots = res.slots;
      if (res.appts) appts = res.appts;

      let ok = !!res.ok;
      if (!ok && res.appts && !res.appts.some(function (a) { return a.key === key; })) ok = true;

      renderAppts();
      renderChips();
      if (ok) setAMsg('ยกเลิกนัดวันที่ ' + (res.label || label) + ' เรียบร้อยแล้ว', 'ok');
      else setAMsg(res.message || 'ยกเลิกไม่สำเร็จ ลองใหม่อีกครั้ง', 'err');
    }
  });
}

/* ---------- ออกจากระบบ ---------- */
function doLogout(message) {
  if (token) callRpc('logout', [token]).catch(function () {});
  token = '';
  slots = [];
  appts = [];
  selected = {};
  calM = -1; calDay = '';
  busy = false;
  histOpen = false;
  closeDialog(true);
  onsite = { place: '', mapUrl: '' };
  linkNotes = [];
  linkGroups = [];
  currentGroup = -1;
  $('lkGroups').textContent = '';
  $('lkItems').textContent = '';
  $('apptBox').textContent = '';
  $('slotList').textContent = '';
  $('hello').textContent = '';
  $('sid').value = '';
  $('email').value = '';
  closeBook();
  setAMsg('');
  showTab('links');
  setBox('msg', (typeof message === 'string') ? message : '', 'err');
  $('homeBox').style.display = 'none';
  $('loginBox').style.display = 'block';
}

['sid', 'email'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
});

// ฉากหลังหน้า login: สัญลักษณ์คณิตศาสตร์ลอยขึ้น
(function () {
  const fx = $('fx');
  if (!fx) return;
  const S = ['∑', 'π', '√', 'cos', '∞', '≈', 'x²', 'θ', 'Δ', '±', '%', '÷', 'f(x)', 'sin', '∠','tan','y','x','y²'];
  for (let i = 0; i < 18; i++) {
    const e = document.createElement('span');
    e.className = 'sym';
    e.textContent = S[i % S.length];
    e.style.left = (Math.random() * 96) + '%';
    e.style.fontSize = (18 + Math.random() * 28) + 'px';
    e.style.animationDuration = (14 + Math.random() * 14) + 's';
    e.style.animationDelay = (-Math.random() * 20) + 's';
    fx.appendChild(e);
  }
})();

// การ์ด login เอียงตามเมาส์ (เฉพาะจอที่มีเมาส์)
(function () {
  if (!window.matchMedia || !matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches) return;
  const card = $('loginCard');
  document.addEventListener('mousemove', function (e) {
    if ($('loginBox').style.display === 'none') return;
    const rx = -((e.clientY / window.innerHeight) - .5) * 6;
    const ry = ((e.clientX / window.innerWidth) - .5) * 8;
    card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
    card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
  });
  document.addEventListener('mouseleave', function () {
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
  });
})();

/* ---------- ตัวช่วยของ intro ใหม่ ---------- */
function reduceMotion() {
  return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}
// ถ้ามีโค้ดเสียงระฆังของเดิม ให้ใส่ในฟังก์ชันนี้ (ตอนนี้ไม่ทำอะไร)
function playBell(i, vol, quiet) {}

/* ---------- intro ใหม่: Check -> Point -> จางหาย ---------- */
(function () {
  const lb = $('loginBox');
  function enter() { lb.classList.add('enter'); }
  if (reduceMotion()) { enter(); return; }

  const ti = el('div'); ti.id = 'textIntro'; ti.setAttribute('aria-hidden', 'true');
  const words = el('div', 'ti-words');
  function addWord(text, delay) {
    const m = el('span', 'ti-mask');
    const w = el('span', 'ti-in', text);
    w.style.setProperty('--d', delay + 's');
    m.appendChild(w);
    words.appendChild(m);
  }
  addWord('Check', 0.1);   // Check ขึ้นก่อน
  addWord('Point', 0.55);  // Point ตามมา
  ti.appendChild(words);
  ti.appendChild(el('div', 'ti-skip', 'แตะเพื่อข้าม'));
  document.body.appendChild(ti);

  let revealed = false;
  const timers = [];
  function later(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function reveal(ms) {
    if (revealed) return;
    revealed = true;
    timers.forEach(clearTimeout);
    enter();
    ti.style.transitionDuration = ms + 'ms';
    ti.classList.add('tiOut');
    setTimeout(function () { if (ti.parentNode) ti.parentNode.removeChild(ti); }, ms + 80);
  }

  later(250, function () { playBell(0, .6, true); });
  later(700, function () { playBell(1, .7, true); });
  later(1500, function () { reveal(400); });

  ti.addEventListener('click', function () {
    if (revealed) return;
    playBell(0, .6);
    reveal(250);
  });
})();
</script>
