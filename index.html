<!-- ===== วางบล็อกนี้ทั้งก้อน ไว้ก่อนบรรทัด </body> (ต่อจาก </script> ตัวเดิม) แล้วจบ ไม่ต้องแก้ที่อื่น ===== -->
<style>
  #cube { display: none; }
  .bells { --bw: 96px; position: absolute; inset: 0; }
  @media (max-width: 400px) { .bells { --bw: 84px; } }
  .bl-rail {
    position: absolute; left: 4%; right: 4%; top: 0; height: 8px; z-index: 1;
    border-radius: 0 0 6px 6px; background: linear-gradient(#94a3b8, #475569);
    box-shadow: 0 2px 6px rgba(15, 23, 42, .25);
  }
  .bl { position: absolute; top: 6px; width: 0; height: 0; z-index: 2; }
  .bl-ring {
    position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; z-index: 1;
    border: 3px solid #64748b; border-radius: 50%;
  }
  .bl-sw { position: absolute; top: 0; left: calc(var(--bw) / -2); width: var(--bw); transform-origin: 50% 0; will-change: transform; }
  .bl-str { width: 2px; margin: 0 auto; background: linear-gradient(#64748b, #94a3b8); }
  .bl-body { position: relative; width: 100%; cursor: pointer; filter: drop-shadow(0 6px 8px rgba(15, 23, 42, .25)); }
  .bl-body svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bl-lab {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    color: #fff; font-size: 11px; font-weight: 500; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  .bl-lab .fi { font-size: 22px; line-height: 1.1; }
</style>
<script>
/* ===== กระดิ่ง 3 ใบ แทนลูกเต๋า (ใช้ตัวแปร/ฟังก์ชันเดิม: TABS, cs, drag, dragMoved, tween ฯลฯ) ===== */
// x = ตำแหน่งแนวนอน(%), len = ความยาวสาย(px), T = คาบแกว่ง(วินาที), c = [สีเข้ม, สีไฮไลต์], f = โน้ตเสียง(Hz)
const BELLS = [
  { x: 20, len: 34, T: 1.9, c: ['#4f46e5', '#a5b4fc'], f: 784 },
  { x: 50, len: 92, T: 2.9, c: ['#7c3aed', '#c4b5fd'], f: 587 },
  { x: 80, len: 60, T: 2.4, c: ['#0284c7', '#7dd3fc'], f: 659 }
];
const AUTO_SPIN = 0.02;   // องศา/มิลลิวินาที (หมุนเองช้าๆ)
const SVGNS = 'http://www.w3.org/2000/svg';
const BELL_PATH = 'M60 8C42 8 32 26 32 52C32 82 24 98 10 114L110 114C96 98 88 82 88 52C88 26 78 8 60 8Z';
const BL = [];
let actx = null;

function sv(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

(function buildBells() {
  cubeWrap.insertBefore(el('div', 'bl-rail'), cubeWrap.firstChild);
  const bellsEl = el('div', 'bells');
  cubeWrap.insertBefore(bellsEl, cubeWrap.querySelector('.cube-hint'));
  const hint = cubeWrap.querySelector('.cube-hint');
  if (hint) hint.textContent = 'ลากเพื่อหมุนกระดิ่ง · แตะที่กระดิ่งเพื่อเปิด หรือเลือกแท็บ';

  BELLS.forEach(function (cfg, i) {
    const t = TABS[i];
    const o = el('div', 'bl'); o.style.left = cfg.x + '%';
    o.appendChild(el('div', 'bl-ring'));
    const sw = el('div', 'bl-sw');
    const str = el('div', 'bl-str'); str.style.height = cfg.len + 'px';
    sw.appendChild(str);

    const body = el('div', 'bl-body');
    const svg = sv('svg', { viewBox: '0 0 120 150' });
    const defs = sv('defs', {}, svg);
    const g = sv('linearGradient', { id: 'blg' + i, x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
    sv('stop', { offset: 0, 'stop-color': cfg.c[0] }, g);
    const mid = sv('stop', { offset: .5, 'stop-color': cfg.c[1] }, g);
    sv('stop', { offset: 1, 'stop-color': cfg.c[0] }, g);
    const cp = sv('clipPath', { id: 'blc' + i }, defs);
    sv('path', { d: BELL_PATH }, cp);

    sv('path', { d: BELL_PATH, fill: 'url(#blg' + i + ')' }, svg);
    const mg = sv('g', { 'clip-path': 'url(#blc' + i + ')' }, svg);
    const mer = [];
    for (let k = 0; k < 6; k++) mer.push(sv('path', { fill: 'none', stroke: '#fff', 'stroke-width': 1.6 }, mg));
    sv('rect', { x: 6, y: 111, width: 108, height: 11, rx: 5.5, fill: 'url(#blg' + i + ')' }, svg);
    const clap = sv('circle', { cx: 60, cy: 129, r: 9, fill: cfg.c[0] }, svg);
    sv('circle', { cx: 60, cy: 8, r: 5, fill: cfg.c[1] }, svg);
    body.appendChild(svg);

    const lab = el('div', 'bl-lab');   // ป้ายอยู่นอก SVG ไม่หมุนตามมุมมอง จึงอ่านได้ทุกมุม
    lab.appendChild(el('span', 'fi', t.icon));
    lab.appendChild(el('span', '', t.label));
    body.appendChild(lab);
    body.onclick = function () { if (!dragMoved) goTab(i); };

    sw.appendChild(body); o.appendChild(sw); bellsEl.appendChild(o);
    BL.push({ sw: sw, body: body, mid: mid, mer: mer, clap: clap,
              a: 0, v: 0, c: 0, ph: i * 2.1, w: 2 * Math.PI / (cfg.T * 1000) });
  });
})();

function drawBells(t) {
  BL.forEach(function (b, i) {
    const sway = 3 * Math.sin(t * b.w * 0.9 + b.ph);                       // แกว่งเบาๆ ตลอด
    b.sw.style.transform = 'rotate(' + (sway + b.a).toFixed(2) + 'deg)';
    const th = (cs.ry + i * 47) * Math.PI / 180;                            // มุมหมุนของแต่ละใบ
    b.mid.setAttribute('offset', (0.5 + 0.32 * Math.sin(th)).toFixed(3));   // ไฮไลต์เลื่อน
    for (let k = 0; k < 6; k++) {                                           // เส้นลายรอบตัวกระดิ่ง
      const q = th + k * Math.PI / 3, s = Math.sin(q), c = Math.cos(q);
      b.mer[k].setAttribute('d', 'M' + (60 + 12 * s).toFixed(1) + ' 14Q' + (60 + 31 * s).toFixed(1) + ' 56 ' + (60 + 50 * s).toFixed(1) + ' 112');
      b.mer[k].setAttribute('stroke-opacity', c > 0 ? (0.5 * c).toFixed(2) : '0');
    }
    const off = Math.max(-8, Math.min(8, (b.c - b.a) * 0.6));               // ลูกตุ้มแกว่งตามหลัง
    b.clap.setAttribute('cx', (60 + off).toFixed(1));
  });
}

function chime(f) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime, out = actx.createGain();
    out.gain.value = 0.3; out.connect(actx.destination);
    [[1, 1, 2.2], [2.76, .5, 1.4], [5.4, .25, .8], [8.93, .12, .5]].forEach(function (p) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f * p[0];
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(p[1], t0 + .005);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + p[2]);
      o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + p[2] + .05);
    });
  } catch (e) {}
}
function ringBell(i) {
  BL[i].v += (Math.random() < .5 ? -1 : 1) * 28 * BL[i].w;   // แกว่งแรง ประมาณ ±28°
  chime(BELLS[i].f);
}

/* ===== ทับฟังก์ชันเดิมของลูกเต๋า (ชื่อเดิม โค้ดเดิมที่เรียกใช้จึงใช้ของใหม่อัตโนมัติ) ===== */
function drawCube() { drawBells(performance.now()); }

function startLoop() {
  if (loopOn || reduceMotion()) return;
  loopOn = true; lastT = performance.now();
  requestAnimationFrame(loopFrame);
}
function loopFrame(t) {
  if (cubeMode === 'open' || $('homeBox').style.display === 'none') { loopOn = false; return; }
  const dt = Math.max(0, Math.min(50, t - lastT)); lastT = t;
  if (!(drag && dragMoved)) {
    cs.vy += (AUTO_SPIN - cs.vy) * (1 - Math.exp(-dt / 900));   // แรงเฉื่อยค่อยๆ กลับสู่การหมุนช้าๆ
    cs.ry += dt * cs.vy;
  }
  BL.forEach(function (b) {
    const acc = -b.w * b.w * b.a - 2 * 0.08 * b.w * b.v;        // สปริง + แรงหน่วง
    b.v += acc * dt; b.a += b.v * dt;
    b.c += (b.a - b.c) * (1 - Math.exp(-dt / 180));
  });
  drawBells(t);
  requestAnimationFrame(loopFrame);
}

function resetCube() {
  cubeGen++;
  cubeMode = 'cube'; openIdx = -1;
  cs.ry = 0; cs.vy = AUTO_SPIN;
  BL.forEach(function (b) { b.a = 0; b.v = 0; b.c = 0; });
  stage.classList.add('fixed');
  cubeWrap.style.opacity = 1;
  TABS.forEach(function (t) {
    const p = $(t.page); p.classList.remove('show'); p.style.opacity = ''; p.style.transform = ''; p.style.transformOrigin = '';
  });
  markTab(-1); drawBells(0); gmStop(); startLoop();
}

function bellOrigin(i) {
  const r = stage.getBoundingClientRect(), m = BL[i].body.getBoundingClientRect();
  return (m.left + m.width / 2 - r.left).toFixed(1) + 'px ' + (m.top + m.height * 0.4 - r.top).toFixed(1) + 'px';
}

function openFromCube(i) {
  cubeMode = 'busy'; openIdx = i; markTab(i);
  const pg = $(TABS[i].page);
  pg.classList.add('show');
  if (reduceMotion()) { finishOpen(); return; }
  ringBell(i);
  const g = cubeGen;
  pg.style.transformOrigin = bellOrigin(i);
  pg.style.transform = 'scale(.05)'; pg.style.opacity = 0;
  setTimeout(function () {                      // รอให้กระดิ่งแกว่งสักครู่ก่อนขยาย
    if (g !== cubeGen) return;
    tween(520, easeInOut, function (v) {
      pg.style.transform = 'scale(' + (0.05 + 0.95 * v) + ')';
      pg.style.opacity = Math.min(1, v * 1.6);
      cubeWrap.style.opacity = 1 - Math.min(1, v * 1.3);
    }, finishOpen);
  }, 380);
}

function finishOpen() {
  const pg = $(TABS[openIdx].page);
  pg.style.opacity = ''; pg.style.transform = ''; pg.style.transformOrigin = '';
  cubeWrap.style.opacity = 1;
  stage.classList.remove('fixed');
  cubeMode = 'open';
}

function closeToCube(after) {
  cubeMode = 'busy';
  const i = openIdx, pg = $(TABS[i].page);
  const r = stage.getBoundingClientRect();
  if (r.top < 0) { try { window.scrollTo(0, window.scrollY + r.top - 8); } catch (e) {} }
  stage.classList.add('fixed');
  markTab(-1);
  cubeWrap.style.opacity = 0;
  startLoop();
  function done() {
    pg.classList.remove('show'); pg.style.opacity = ''; pg.style.transform = ''; pg.style.transformOrigin = '';
    cubeWrap.style.opacity = 1;
    openIdx = -1; cubeMode = 'cube'; gmStop(); startLoop();
    if (after) after();
  }
  if (reduceMotion()) { done(); return; }
  pg.style.transformOrigin = bellOrigin(i);
  tween(420, easeOut, function (v) {
    const u = 1 - v;
    pg.style.transform = 'scale(' + (0.05 + 0.95 * u) + ')';
    pg.style.opacity = Math.min(1, u * 1.6);
    cubeWrap.style.opacity = Math.min(1, v * 1.3);
  }, done);
}
</script>
