<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ============ ตัวแปรสี ============ */
    :root {
      --bg1: #eef2ff; --bg2: #f8fafc;
      --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --primary: #4f46e5; --primary-d: #4338ca; --primary-l: #eef2ff;
      --ok: #15803d; --ok-bg: #f0fdf4;
      --err: #b91c1c; --err-bg: #fef2f2;
      --warn: #92400e; --warn-bg: #fffbeb;
      --online: #2563eb; --online-bg: #eff6ff;
      --onsite: #059669; --onsite-bg: #ecfdf5;
      --radius: 16px;
      /* >>> แทนข้อความ "วางโลโก้ของคุณตรงนี้" ด้วย base64 โลโก้เดิมของคุณ <<< */
      --logo: url("data:image/webp;base64,วางโลโก้ของคุณตรงนี้");
    }

    /* ============ พื้นฐาน ============ */
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); min-height: 100vh;
      font-family: 'Prompt', 'Noto Sans Thai', -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2) 320px);
    }
    button { font-family: inherit; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
    .wrap.center { padding-top: 48px; }
    .panel {
      background: #fff; border-radius: var(--radius); padding: 16px; margin-top: 14px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .sec { margin: 26px 4px 6px; font-size: 16px; font-weight: 600; }
    .sec.first { margin-top: 4px; }
    .hint { font-size: 14px; color: var(--muted); }

    /* ============ ปุ่ม ============ */
    .btn {
      display: block; width: 100%; border: 0; border-radius: 12px;
      padding: 14px 16px; font-size: 16px; font-weight: 500; cursor: pointer;
      transition: transform .05s, box-shadow .2s;
    }
    .btn.primary { color: #fff; background: linear-gradient(135deg, var(--primary), #6366f1); box-shadow: 0 6px 16px rgba(79, 70, 229, .3); }
    .btn.primary:active { transform: translateY(1px); }
    .btn.ghost { background: #e2e8f0; color: #334155; }
    .btn.danger { color: #fff; background: #dc2626; box-shadow: 0 6px 16px rgba(220, 38, 38, .25); }
    .btn:disabled { opacity: .6; cursor: progress; box-shadow: none; }
    .btn:focus-visible, .cal-day:focus-visible, .cal-nav:focus-visible, .mini:focus-visible, .tab:focus-visible,
    .gbtn:focus-visible, .lk-back:focus-visible { outline: 3px solid rgba(79, 70, 229, .4); outline-offset: 2px; }
    .mini {
      display: inline-block; width: auto; margin: 10px 8px 0 0; padding: 7px 14px;
      border: 0; border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    .mini.cancel { background: var(--err-bg); color: var(--err); }
    .mini.hist-more { display: block; width: 100%; margin: 10px 0 0; text-align: center; background: #e2e8f0; color: #334155; }
    .pill, .dlg-link {
      display: inline-block; margin: 8px 6px 0 0; padding: 7px 12px; border-radius: 999px;
      font-size: 14px; font-weight: 500; text-decoration: none;
      background: var(--primary-l); color: var(--primary-d);
    }

    /* ============ กล่องข้อความ ============ */
    .msgbox { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
    .msgbox.ok { background: var(--ok-bg); color: var(--ok); }
    .msgbox.err { background: var(--err-bg); color: var(--err); }
    .msgbox.info { background: var(--online-bg); color: var(--online); }

    /* ============ หน้า login ============ */
    .card { background: #fff; border-radius: 20px; padding: 28px 24px; box-shadow: 0 10px 30px rgba(79, 70, 229, .12); }
    .logo-img { width: 150px; aspect-ratio: 158 / 82; margin: 0 auto 10px; background: var(--logo) center / contain no-repeat; }
    .center-text { text-align: center; }
    .brand-name {
      font-weight: 600; font-size: 18px;
      background: linear-gradient(90deg, var(--ink) 0 35%, #7c3aed 50%, var(--ink) 65% 100%);
      background-size: 250% 100%; background-position: 100% 0;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: shine 4s linear infinite;
    }
    .sub { color: var(--muted); font-size: 14px; margin: 4px 0 20px; }
    .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 13px 14px; margin-bottom: 16px; font-size: 16px;
      font-family: inherit; border: 1.5px solid var(--line); border-radius: 12px;
      background: #f8fafc; color: var(--ink);
    }
    .field input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, .15); }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 48px; }
    .pw-toggle {
      position: absolute; right: 6px; top: 4px; width: 40px; height: 40px;
      border: 0; background: transparent; font-size: 18px; cursor: pointer;
    }
    
    /* ฉากหลังเคลื่อนไหว + การ์ดเรืองแสง */
    @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .fx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .fx::before {
      content: ''; position: absolute; inset: -40px;
      background-image: linear-gradient(rgba(79,70,229,.07) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(79,70,229,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      animation: gridMove 8s linear infinite;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: orbDrift 14s ease-in-out infinite alternate; }
    .orb.o1 { width: 380px; height: 380px; background: #a5b4fc; top: -100px; left: -80px; }
    .orb.o2 { width: 340px; height: 340px; background: #c4b5fd; bottom: -90px; right: -70px; animation-duration: 18s; animation-delay: -4s; }
    .orb.o3 { width: 260px; height: 260px; background: #7dd3fc; top: 45%; left: 55%; opacity: .4; animation-duration: 16s; animation-delay: -8s; }
    .sym { position: absolute; bottom: -60px; color: var(--primary); font-weight: 600; opacity: 0; animation: symFloat linear infinite; }
    #loginCard { position: relative; z-index: 1; }
    .card.glow {
      isolation: isolate; background: transparent;
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .15s ease-out;
    }
    .card.glow::before {
      content: ''; position: absolute; inset: -2px; border-radius: 22px; z-index: -2;
      background: conic-gradient(from var(--ang), #4f46e5, #7c3aed, #38bdf8, #a78bfa, #4f46e5);
      animation: angSpin 5s linear infinite;
    }
    .card.glow::after { content: ''; position: absolute; inset: 0; border-radius: 20px; background: #fff; z-index: -1; }
    #btn { position: relative; overflow: hidden; }
    #btn::after {
      content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
      transform: skewX(-20deg); animation: sweep 3.2s ease-in-out 1.5s infinite;
    }

    /* เริ่มเล่นเมื่อ intro จบ (JS ใส่ class enter) */
    .enter .card.glow { animation: cardIn .8s cubic-bezier(.2, 1.1, .3, 1) both; }
    .enter .logo-img { animation: popIn .7s cubic-bezier(.2, 1.4, .4, 1) .25s both, floaty 4s ease-in-out 1s infinite; }
    .enter .rise { animation: rise .6s ease var(--d, 0s) both; }
    .enter .brand-name.rise { animation: rise .6s ease var(--d, 0s) both, shine 4s linear 1s infinite; }

    @keyframes gridMove { to { transform: translate(40px, 40px); } }
    @keyframes orbDrift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 40px) scale(1.15); } }
    @keyframes symFloat {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%, 90% { opacity: .18; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    @keyframes angSpin { to { --ang: 360deg; } }
    @keyframes shine { to { background-position: 0 0; } }
    @keyframes sweep { 0% { left: -60%; } 60%, 100% { left: 130%; } }
    @keyframes cardIn { from { opacity: 0; translate: 0 40px; scale: .94; } to { opacity: 1; translate: 0 0; scale: 1; } }
    @keyframes popIn { from { opacity: 0; scale: .5; } to { opacity: 1; scale: 1; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes rise { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }

    /* ============ ส่วนหัวหน้าหลัก ============ */
    .hero {
      position: relative; color: #fff; border-radius: 20px; padding: 22px 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 10px 24px rgba(79, 70, 229, .3);
    }
    .hero .brand { font-size: 12px; letter-spacing: .08em; opacity: .85; text-transform: uppercase; }
    .hero h2 { margin: 6px 0 0; font-size: 22px; font-weight: 600; padding-right: 96px; word-break: break-word; }
    .hero .out {
      position: absolute; top: 14px; right: 14px; border: 0; cursor: pointer;
      background: rgba(255, 255, 255, .2); color: #fff; border-radius: 999px;
      padding: 6px 12px; font-size: 13px;
    }
    .hw { display: inline-block; white-space: nowrap; }
    .hl { display: inline-block; border-radius: 6px; animation: hlIn .5s cubic-bezier(.2, 1.3, .4, 1) both; }
    .hwave { display: inline-block; animation: emojiIn .6s cubic-bezier(.2, 1.3, .4, 1) both; }
    @keyframes hlIn {
      0% { opacity: 0; transform: translateY(-12px) rotate(-60deg) scale(.5);
           box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .9); background: rgba(255, 255, 255, .25); }
      55% { opacity: 1; transform: translateY(1px) rotate(6deg) scale(1.08);
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .18); }
      100% { opacity: 1; transform: none;
             box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0); background: rgba(255, 255, 255, 0); }
    }
    @keyframes emojiIn {
      0% { opacity: 0; transform: scale(.3) rotate(-30deg); }
      60% { opacity: 1; transform: scale(1.2) rotate(15deg); }
      100% { opacity: 1; transform: none; }
    }

    /* ============ แท็บนำทาง ============ */
    .layout { margin-top: 16px; }
    .nav { display: flex; gap: 6px; padding: 6px; background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(15, 23, 42, .06); }
        .tab {
      position: relative; overflow: hidden; flex: 1; border: 0; background: transparent;
      color: var(--muted); padding: 11px 8px; border-radius: 10px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      transition: transform .3s cubic-bezier(.2, 1.4, .4, 1), background .25s, color .25s, box-shadow .25s;
    }
    .tab::before {
      content: ''; position: absolute; top: 0; left: -70%; width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .75), transparent);
      transform: skewX(-20deg); pointer-events: none;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff; box-shadow: 0 6px 16px rgba(79, 70, 229, .35);
    }
    .tab:active { transform: scale(.95); }
    @media (hover: hover) {
      .tab:hover { transform: translateY(-3px) scale(1.04); }
      .tab:hover:not(.active) {
        background: var(--primary-l); color: var(--primary-d);
        box-shadow: 0 8px 18px rgba(79, 70, 229, .22);
      }
      .tab:hover::before { animation: tabShine .7s ease; }
    }
    @media (hover: hover) and (min-width: 768px) {
      .tab:hover { transform: translateX(6px) scale(1.03); }
    }
    @keyframes tabShine { to { left: 130%; } }

    /* สไลด์หน้าเวลาเปลี่ยนแท็บ */
    body { overflow-x: hidden; }
    .slide-r { animation: slideInR .5s cubic-bezier(.2, .9, .3, 1) both; }
    .slide-l { animation: slideInL .5s cubic-bezier(.2, .9, .3, 1) both; }
    .slide-r > *, .slide-l > * { animation: itemUp .5s ease both; }
    .slide-r > :nth-child(2), .slide-l > :nth-child(2) { animation-delay: .08s; }
    .slide-r > :nth-child(3), .slide-l > :nth-child(3) { animation-delay: .16s; }
    .slide-r > :nth-child(4), .slide-l > :nth-child(4) { animation-delay: .24s; }
    @keyframes slideInR { from { opacity: 0; translate: 60px 0; } to { opacity: 1; translate: 0 0; } }
    @keyframes slideInL { from { opacity: 0; translate: -60px 0; } to { opacity: 1; translate: 0 0; } }
    @keyframes itemUp { from { opacity: 0; translate: 0 18px; scale: .97; } to { opacity: 1; translate: 0 0; scale: 1; } }
    .pages { margin-top: 14px; }

    /* ============ ลิงก์ (แบ่งหมวด) ============ */
    .lk-groups .gbtn {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      width: 100%; margin-top: 8px; padding: 14px; text-align: left; cursor: pointer;
      background: #fff; color: var(--ink); border: 2px solid var(--line);
      border-radius: 14px; font-size: 16px; font-weight: 500;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
    }
    .lk-groups .gbtn:first-child { margin-top: 0; }
    .gbtn::after { content: '›'; font-size: 22px; color: var(--primary); }
    .gbtn.active { border-color: var(--primary); background: var(--primary-l); color: var(--primary-d); }
    .lk-groups .nbtn { display: none; }
    .lk-groups .nbtn + .gbtn { margin-top: 0; }
    .lk.picked .lk-groups { display: none; }
    .lk-head { display: flex; align-items: center; gap: 10px; margin: 0 2px 4px; }
    .lk-back { width: auto; padding: 6px 12px; border: 0; border-radius: 10px; background: #e2e8f0; color: #334155; font-size: 14px; cursor: pointer; }
    .lk-title { font-weight: 600; font-size: 17px; }
    .lk-note {
      margin-top: 12px; padding: 14px 16px; background: #fff; border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
      font-size: 14px; line-height: 1.75; white-space: pre-line; overflow-wrap: break-word;
    }
    a.link {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-top: 8px; padding: 14px; background: #fff; color: var(--ink);
      border: 1px solid var(--line); border-radius: 14px; text-decoration: none;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
    }
    a.link::after { content: '›'; font-size: 22px; color: var(--primary); }
    a.link:active { background: var(--primary-l); }

    /* ============ จองนัด: ขั้นตอน + ตัวเลือก ============ */
    .step { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 4px 0 10px; }
    .step .num {
      width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary); color: #fff;
    }
    .step small { font-weight: 400; color: var(--muted); font-size: 13px; }
    .step.second { margin-top: 18px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { position: relative; display: block; cursor: pointer; }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt span { display: block; text-align: center; padding: 12px 8px; font-weight: 500; border: 2px solid var(--line); border-radius: 14px; background: #fff; }
    .opt small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .opt input:checked + span { border-color: var(--primary); background: var(--primary-l); color: var(--primary-d); }
    .opt input:focus-visible + span { outline: 3px solid rgba(79, 70, 229, .4); outline-offset: 2px; }
    #submitBook { margin-top: 18px; }

    /* ============ ปฏิทิน ============ */
    .cal { background: #f8faff; border-radius: 16px; padding: 12px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
    .cal-title { font-size: 16px; font-weight: 500; }
    .cal-nav { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; font-size: 22px; color: var(--ink); cursor: pointer; }
    .cal-nav:hover:not(:disabled) { background: var(--primary-l); }
    .cal-nav:disabled { opacity: .3; cursor: default; }
    .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .cal-dow span { font-size: 12px; color: var(--muted); padding: 6px 0; }
    .cal-day {
      position: relative; border: 0; background: transparent; font-size: 15px; color: #94a3b8;
      width: 100%; max-width: 44px; aspect-ratio: 1; margin: 2px auto; border-radius: 50%; cursor: default;
    }
    .cal-day.has { color: var(--primary-d); background: var(--primary-l); font-weight: 600; cursor: pointer; }
    .cal-day.has.booked, .cal-day.has.full { background: #e2e8f0; color: #64748b; }
    .cal-day.has.sel { background: var(--primary-l); box-shadow: inset 0 0 0 2px var(--primary); }
    .cal-day.has.active { background: var(--primary); color: #fff; }
    .cal-day.today:not(.active)::after {
      content: ''; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px;
      margin-left: -2px; border-radius: 50%; background: currentColor;
    }
    .cal-detail { margin-top: 12px; padding: 14px; border: 2px solid var(--primary); border-radius: 14px; background: #fff; }
    .cal-detail .d-date { font-size: 13px; color: var(--muted); }
    .cal-detail .d-lesson { font-size: 18px; font-weight: 600; line-height: 1.35; margin-top: 2px; overflow-wrap: break-word; }
    .cal-detail .d-time { margin-top: 8px; font-size: 15px; font-weight: 500; color: var(--primary-d); }
    .cal-detail .btn { margin-top: 12px; padding: 11px 14px; font-size: 15px; }
    .c-seat { display: inline-block; margin-top: 8px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); }
    .c-seat.low { background: var(--warn-bg); color: var(--warn); }
    .c-seat.off { background: #e2e8f0; color: #64748b; }
    .cal-hint { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
    .cal-picked { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .cal-picked .tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px;
      border-radius: 999px; background: var(--primary-l); color: var(--primary-d); font-size: 14px; font-weight: 500;
    }
    .tag button { border: 0; background: rgba(79,70,229,.15); color: var(--primary-d); width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }

    /* ============ นัดของฉัน + ประวัติ ============ */
    .appt {
      display: flex; gap: 12px; margin-top: 10px; padding: 12px;
      background: #fff; border-radius: var(--radius); border-left: 4px solid var(--online);
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .appt.onsite { border-left-color: var(--onsite); }
    .tile { flex: 0 0 56px; text-align: center; border-radius: 12px; padding: 8px 0; background: var(--online-bg); color: var(--online); align-self: flex-start; }
    .appt.onsite .tile { background: var(--onsite-bg); color: var(--onsite); }
    .tile b { display: block; font-size: 22px; line-height: 1.1; }
    .tile span { display: block; font-size: 12px; text-transform: uppercase; }
    .abody { flex: 1; min-width: 0; }
    .badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--online-bg); color: var(--online); }
    .appt.onsite .badge { background: var(--onsite-bg); color: var(--onsite); }
    .year { font-size: 12px; color: var(--muted); margin-left: 6px; }
    .lesson { margin-top: 8px; font-size: 14px; }
    .ltitle { margin-top: 8px; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: break-word; }
    .atime { margin-top: 4px; font-size: 14px; font-weight: 500; color: var(--primary-d); }
    .wait { margin-top: 8px; font-size: 13px; color: var(--warn); background: var(--warn-bg); padding: 6px 10px; border-radius: 10px; }
    .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .appt.past { opacity: .8; border-left-color: #94a3b8; }
    .appt.past .tile, .appt.past .badge { background: #f1f5f9; color: #64748b; }
    .done-tag { font-size: 12px; color: var(--muted); margin-left: 6px; }

    /* ============ ป๊อปอัปแบบหน้าต่างเกม ============ */
    .dlg-overlay {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(15, 23, 42, .45);
    }
    .dlg-overlay.open { display: flex; animation: dlgFade .15s ease-out; }
    .dlg-overlay.closing { animation: dlgFadeOut .15s ease-in forwards; }
    .dlg-win {
      width: 100%; max-width: 360px; background: #fff; overflow: hidden;
      border: 2.5px solid var(--ink); border-radius: 14px;
      box-shadow: 6px 6px 0 rgba(15, 23, 42, .9);

const SB_URL = 'https://apzntujfqhzadgejdpwf.supabase.co';
const SB_KEY = 'sb_publishable_6hPDr97QyuYA9gX8qCRYqw_cKQPhSGq';

const RPC = {
  login:             { name: 'app_login',  params: ['p_student_id', 'p_email'] },
  bookAppointment:   { name: 'app_book',   params: ['p_token', 'p_dates', 'p_type'] },
  cancelAppointment: { name: 'app_cancel', params: ['p_token', 'p_date'] },

const HIST_SHOW = 5;   // ประวัติแสดงเริ่มต้นกี่รายการ
const HIST_MAX = 10;   // กด "ดูเพิ่ม" แล้วแสดงได้สูงสุดกี่รายการ (ให้ตรงกับ limit ใน SQL)

function callRpc(fn, args) {
  const def = RPC[fn];
  const body = {};
  def.params.forEach(function (p, i) { body[p] = args[i]; });

  const headers = { 'Content-Type': 'application/json', apikey: SB_KEY };
  if (/^eyJ/.test(SB_KEY)) headers.Authorization = 'Bearer ' + SB_KEY;

  return fetch(SB_URL + '/rest/v1/rpc/' + def.name, {
    method: 'POST', headers: headers, body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (data) {
      if (!r.ok) {
        const e = new Error((data && data.message) || ('HTTP ' + r.status));
        e.status = r.status;
        throw e;
      }
      return data;
    });
  });
}

// เรียกซ้ำอัตโนมัติเมื่อเซิร์ฟเวอร์ยุ่ง/ล้มเหลวชั่วคราว
function runRetry(fn, args, opt) {
  const maxFail = opt.maxFail || 4;
  const maxBusy = opt.maxBusy || 12;
  let fails = 0, busies = 0;

  function pause(n) { return Math.min(1200 + n * 600, 5000) + Math.random() * 1500; }
  function wait() {
    if (opt.onWait) opt.onWait(fails + busies);
    setTimeout(go, pause(fails + busies));
  }

  function go() {
    callRpc(fn, args).then(function (res) {
      if (res && res.busy) {
        if (++busies <= maxBusy) return wait();
        return opt.done({ ok: false, busyGiveUp: true }, null);
      }
      opt.done(res, null);
    }, function (err) {
      const retryable = !err.status || err.status >= 500 || err.status === 429;
      if (retryable && ++fails <= maxFail) return wait();
      opt.done(null, err);
    });
  }
  go();
}

function softText(node, text) {
  node.textContent = '';
  String(text).split(/([&\/\-_+,:]+)/).forEach(function (part, i) {
    if (!part) return;
    node.appendChild(document.createTextNode(part));
    if (i % 2 === 1) node.appendChild(document.createElement('wbr'));
  });
}

function setBox(id, text, cls) {
  const m = $(id);
  m.className = text ? 'msgbox ' + (cls || '') : '';
  m.textContent = text || '';
}
function setBMsg(text, cls) { setBox('bmsg', text, cls); }
function setAMsg(text, cls) { setBox('amsg', text, cls); }

function typeName(type) { return type === 'online' ? 'Online' : 'Onsite'; }

function labelFor(key) {
  const hit = appts.concat(slots).filter(function (x) { return x.key === key; })[0];
  return hit ? hit.label : key;
}

/* =====================================================
   4) ป๊อปอัป
   ===================================================== */
let dlgLastFocus = null;
let dlgTimer = null;

function showDialog(o) {
  const ov = $('dlg');
  clearTimeout(dlgTimer);
  if (!ov.classList.contains('open')) dlgLastFocus = document.activeElement;
  ov.classList.remove('closing');

  $('dlgTitle').textContent = o.title || '';
  $('dlgIcon').textContent = o.icon || '';

  const body = $('dlgBody');
  body.textContent = '';
  if (o.message) body.appendChild(el('div', '', o.message));
  if (o.lines && o.lines.length) {
    const l = el('div', 'dlg-list');
    o.lines.forEach(function (t) { l.appendChild(el('span', '', t)); });
    body.appendChild(l);
  }
  if (o.note) body.appendChild(el('div', 'dlg-note', o.note));
  if (o.link && isHttps(o.link.href)) body.appendChild(extLink('dlg-link', o.link.href, o.link.text));

  const act = $('dlgActions');
  act.textContent = '';
  let focusBtn = null;
  (o.buttons || []).forEach(function (bt, i) {
    const b = button('btn ' + (bt.cls || 'primary'), bt.text, function () {
      closeDialog();
      if (bt.onClick) bt.onClick();
    });
    act.appendChild(b);
    if (bt.focus || (!focusBtn && i === 0)) focusBtn = b;
  });

  ov.classList.add('open');
  if (focusBtn) focusBtn.focus();
}

function closeDialog(immediate) {
  const ov = $('dlg');
  if (!ov.classList.contains('open')) return;
  clearTimeout(dlgTimer);
  function finish() {
    ov.classList.remove('open', 'closing');
    try { if (dlgLastFocus && dlgLastFocus.focus) dlgLastFocus.focus(); } catch (e) {}
    dlgLastFocus = null;
  }
  if (immediate) { finish(); return; }
  ov.classList.add('closing');
  dlgTimer = setTimeout(finish, 160);
}

/* =====================================================
   5) ปิดปรับปรุง + ตรวจคำตอบจากเซิร์ฟเวอร์
   ===================================================== */
function isMaint(res) {
  return !!(res && (res.maintenance || /ปรับปรุง/.test(String(res.message || ''))));
}

function showMaintenance(msg) {
  if ($('maint').classList.contains('open')) return;
  doLogout('');
  $('mtMsg').textContent = msg || 'ระบบปิดปรับปรุงชั่วคราว กรุณากลับมาใหม่ภายหลัง';
  $('maint').classList.add('open');
}

function checkStatus() {
  callRpc('status', []).then(function (res) {
    if (!res) return;
    if (res.maintenance) showMaintenance(res.message);
    else if ($('maint').classList.contains('open')) location.reload(); // เปิดระบบแล้ว -> โหลดหน้าใหม่
  }).catch(function () {}); // เช็กไม่ได้ก็ไม่ต้องทำอะไร (ฝั่งล็อกอิน/จองยังบล็อกให้อยู่)
}

// ตรวจคำตอบของ จอง/ยกเลิก ที่ใช้ร่วมกัน: คืน true ถ้าจัดการจบแล้ว (ให้หยุดทำต่อ)
function handleReply(res, err, say, msgs) {
  if (err || !res)  { say(msgs.fail, 'err'); return true; }
  if (res.busyGiveUp) { say(msgs.busy, 'err'); return true; }
  if (isMaint(res)) { showMaintenance(res.message); return true; }
  if (res.expired)  { doLogout(res.message); return true; }
  if (res.slots) slots = res.slots;
  if (res.appts) appts = res.appts;
  saveSession();
  return false;
}

/* =====================================================
   6) Login / Logout / แท็บ
   ===================================================== */
function doLogin() {
  const btn = $('btn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';
  setBox('msg', '');

  runRetry('login', [$('sid').value, $('email').value], {
    onWait: function (n) {
      setBox('msg', 'ตอนนี้มีผู้ใช้งานจำนวนมาก กำลังลองเชื่อมต่ออีกครั้ง (' + n + ')...', 'info');
    },
    done: function (res, err) {
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
      if (err || !res || res.busyGiveUp) {
        setBox('msg', 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่อีกครั้งในอีกสักครู่', 'err');
        return;
      }
      if (isMaint(res)) { showMaintenance(res.message); return; }
      if (!res.ok) { setBox('msg', res.message || 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง', 'err'); return; }
      setBox('msg', '');
      showHome(res);
    }
  });
}

function showHome(res) {
  resetState();
  token = res.token;
  slots = res.slots || [];
  appts = res.appts || [];
  onsite = res.onsite || onsite;

function doLogout(message) {
  if (token) callRpc('logout', [token]).catch(function () {});
  resetState();
  clearSession();
  closeDialog(true);
  ['lkGroups', 'lkItems', 'apptBox', 'slotList', 'hello'].forEach(function (id) { $(id).textContent = ''; });
  $('sid').value = '';
  $('email').value = '';
  $('email').type = 'password';
  $('pwToggle').textContent = '👁';
  $('sid').type = 'password';
  $('pwToggleSid').textContent = '👁';
  closeBook();
  setAMsg('');
  showTab('links');
  setBox('msg', typeof message === 'string' ? message : '', 'err');
  $('homeBox').style.display = 'none';
  $('loginBox').style.display = 'block';
}

let currentTab = 'links';
const TAB_ORDER = ['links', 'book', 'appts'];
const TAB_IDS = {
  links: ['pageLinks', 'tabLinks'],
  book:  ['pageBook',  'tabBook'],
  appts: ['pageAppts', 'tabAppts']
};

function showTab(name) {
  const changed = name !== currentTab;
  const forward = TAB_ORDER.indexOf(name) > TAB_ORDER.indexOf(currentTab);
  currentTab = name;

  TAB_ORDER.forEach(function (t) {
    const on = t === name;
    $(TAB_IDS[t][0]).style.display = on ? 'block' : 'none';
    $(TAB_IDS[t][1]).classList.toggle('active', on);
    $(TAB_IDS[t][1]).setAttribute('aria-selected', String(on));
  });
  try { window.scrollTo(0, 0); } catch (e) {}

  if (changed && !reduceMotion()) {
    const page = $(TAB_IDS[name][0]);
    page.classList.remove('slide-r', 'slide-l');
    void page.offsetWidth; // ทำให้อนิเมชันเริ่มใหม่ทุกครั้ง
    page.classList.add(forward ? 'slide-r' : 'slide-l');
  }
}

/* =====================================================
   7) ข้อความต้อนรับ
   ===================================================== */
function splitChars(s) {
  try {
    if (window.Intl && Intl.Segmenter) {
      return Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s),
        function (x) { return x.segment; });
    }
  } catch (e) {}
  return s.match(/[^\u0E31\u0E34-\u0E3A\u0E47-\u0E4E][\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]*|[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]+/gu) || [s];
}

function welcome(name) {
  const h = $('hello');
  h.textContent = '';
  h.setAttribute('aria-label', 'สวัสดี ' + name);

  let i = 0;
  ('สวัสดี ' + name).split(/\s+/).filter(Boolean).forEach(function (w, wi) {
    if (wi) h.appendChild(document.createTextNode(' '));
    const ws = el('span', 'hw');
    ws.setAttribute('aria-hidden', 'true');
    splitChars(w).forEach(function (ch) {
      const s = el('span', 'hl', ch);
      s.style.animationDelay = (Math.min(i++, 30) * 45) + 'ms';
      ws.appendChild(s);
    });
    h.appendChild(ws);
  });

  const e = el('span', 'hwave', ' 👋');
  e.setAttribute('aria-hidden', 'true');
  e.style.animationDelay = (Math.min(i, 30) * 45 + 150) + 'ms';
  h.appendChild(e);
}

/* =====================================================
   8) ลิงก์ (แบ่งหมวด)
   ===================================================== */
function buildGroups(links) {
  const order = [];
  const map = Object.create(null);
  (links || []).forEach(function (l) {
    if (!isHttps(l.url)) return;
    const g = String(l.group || '').trim() || 'อื่นๆ';
    if (!(g in map)) { map[g] = []; order.push(g); }
    map[g].push({ title: l.title, url: l.url });
  });
  return order.map(function (g) { return { name: g, items: map[g] }; });
}

let linkView = 'home';   // home | notes | years | year | bluebook
let linkYear = -1;

function isBluebook(name) { return /bluebook/i.test(String(name)); }

function renderLinks(links, notes) {
  linkNotes = notes || [];
  linkGroups = buildGroups(links);
  linkView = 'home';
  linkYear = -1;
  drawLinks();
}

function drawLinks() {
  const box = $('lkItems');
  $('lkGroups').textContent = '';
  box.textContent = '';
  $('lk').className = 'lk single';

  const pastGroups = linkGroups.filter(function (g) { return !isBluebook(g.name); });
  let blueItems = [];
  linkGroups.forEach(function (g) { if (isBluebook(g.name)) blueItems = blueItems.concat(g.items); });

  function go(view, yr) {
    linkView = view;
    if (yr !== undefined) linkYear = yr;
    drawLinks();
  }

  function menuCard(cls, icon, title, sub, onclick) {
    const b = button('mcard ' + cls);
    if (icon) b.appendChild(el('span', 'm-icon', icon));
    b.appendChild(el('span', 'm-title', title));
    if (sub) b.appendChild(el('span', 'm-sub', sub));
    b.onclick = onclick;
    return b;
  }

  function headBar(title, backView) {
    const head = el('div', 'lk-head');
    head.appendChild(button('lk-back', '‹ กลับ', function () { go(backView); }));
    head.appendChild(el('div', 'lk-title', title));
    box.appendChild(head);
  }

  function linkList(items) {
    items.forEach(function (it) { box.appendChild(extLink('link', it.url, it.title)); });
  }

  // ----- หน้าแรก: 3 ปุ่มหลัก -----
  if (linkView === 'home') {
    if (!linkNotes.length && !pastGroups.length && !blueItems.length) {
      box.appendChild(el('div', 'hint', 'ยังไม่มีลิงก์ในตอนนี้'));
      return;
    }
    const grid = el('div', 'menu-grid main');
    if (linkNotes.length) {
      grid.appendChild(menuCard('c1', '📌', 'แนะนำ', 'อ่านก่อนเริ่มทำข้อสอบ',
        function () { go('notes'); }));
    }
    if (pastGroups.length) {
      grid.appendChild(menuCard('c2', '📝', 'ข้อสอบ Past paper', 'เลือกปีที่ต้องการ',
        function () { go('years'); }));
    }
    if (blueItems.length) {
      grid.appendChild(menuCard('c3', '📘', 'รวมเฉลย Bluebook', '',
        function () { go('bluebook'); }));
    }
    box.appendChild(grid);
    return;
  }

  // ----- แนะนำ -----
  if (linkView === 'notes') {
    headBar('📌 แนะนำ', 'home');
    linkNotes.forEach(function (n) { box.appendChild(el('div', 'lk-note', n)); });
    return;
  }

  // ----- เลือกปี -----
  if (linkView === 'years') {
    headBar('📝 ข้อสอบ Past paper', 'home');
    box.appendChild(el('div', 'hint pick-hint', 'เลือกปีที่ต้องการ'));
    const grid = el('div', 'menu-grid years');
    pastGroups.forEach(function (g, i) {
      grid.appendChild(menuCard('year', '', g.name, '', function () { go('year', i); }));
    });
    box.appendChild(grid);
    return;
  }

  // ----- ลิงก์ของปีที่เลือก -----
  if (linkView === 'year' && pastGroups[linkYear]) {
    headBar(pastGroups[linkYear].name, 'years');
    linkList(pastGroups[linkYear].items);
    return;
  }

  // ----- รวมเฉลย Bluebook -----
  if (linkView === 'bluebook') {
    headBar('📘 รวมเฉลย Bluebook', 'home');
    linkList(blueItems);
    return;
  }

  go('home'); // กันพลาด: ถ้าสถานะผิดปกติ ให้กลับหน้าแรก
}

/* =====================================================
   9) นัดของฉัน + ประวัติ
   ===================================================== */
function dateParts(label) {
  const p = String(label).split('/');
  return p.length === 3 ? { d: p[0], m: p[1], y: p[2] } : { d: String(label), m: '', y: '' };
}

function docPill(a) {
  return extLink('pill', a.doc, '📄 เอกสารประกอบบทเรียน');
}

function buildApptCard(a, isPast) {
  const p = dateParts(a.label);
  const isOnline = a.type === 'online';

  const card = el('div', 'appt ' + (isOnline ? 'online' : 'onsite') + (isPast ? ' past' : ''));

  const tile = el('div', 'tile');
  tile.appendChild(el('b', '', p.d));
  tile.appendChild(el('span', '', p.m));
  card.appendChild(tile);

  const body = el('div', 'abody');
  const head = el('div');
  head.appendChild(el('span', 'badge', typeName(a.type)));
  if (p.y) head.appendChild(el('span', 'year', p.y));
  if (isPast) head.appendChild(el('span', 'done-tag', '• ผ่านไปแล้ว'));
  body.appendChild(head);

  if (a.lesson) {
    const l = el('div', 'ltitle');
    softText(l, a.lesson);
    body.appendChild(l);
  }
  body.appendChild(el('div', 'atime', '🕓 ' + TIME_TEXT));
  card.appendChild(body);

  if (isPast) { // ประวัติ: โชว์เฉพาะเอกสารที่มีลิงก์จริง ไม่โชว์ปุ่มยกเลิก/ข้อความเตือน
    if (isHttps(a.doc)) body.appendChild(docPill(a));
    return card;
  }

  if (isOnline) {
    body.appendChild(isHttps(a.link)
      ? extLink('pill', a.link, '👉 Link นัดหมาย online')
      : el('div', 'wait', '⏳ Link นัดหมาย online จะมีให้ในวันนั้น'));
  } else {
    if (onsite.place) body.appendChild(el('div', 'lesson', '📍 สถานที่: ' + onsite.place));
    if (isHttps(onsite.mapUrl)) body.appendChild(extLink('pill', onsite.mapUrl, '🗺️ เปิดแผนที่'));
    body.appendChild(el('div', 'note', 'อย่าลืมมาตามนัดนะ'));
  }

  body.appendChild(isHttps(a.doc)
    ? docPill(a)
    : el('div', 'wait', '⏳ Link เอกสารประกอบบทเรียน จะมีให้ในวันนั้น'));

  body.appendChild(a.canCancel
    ? button('mini cancel', 'ยกเลิกนัด', function () { setAMsg(''); askCancel(a); })
    : el('div', 'note', 'ถึงวันนัดแล้ว ยกเลิกในเว็บไม่ได้ กรุณาติดต่อพี่ๆ'));

  return card;
}

function renderAppts() {
  const box = $('apptBox');
  box.textContent = '';
  if (!appts.length) {
    box.appendChild(el('div', 'hint', 'ยังไม่มีนัด กดแท็บ "จองนัด" เพื่อจองได้เลย'));
    return;
  }

  const today = todayBkk();
  const upcoming = appts.filter(function (a) { return a.key >= today; })
                        .sort(function (x, y) { return x.key < y.key ? -1 : 1; });
  const history = appts.filter(function (a) { return a.key < today; })
                       .sort(function (x, y) { return x.key < y.key ? 1 : -1; }) // ใหม่ -> เก่า
                       .slice(0, HIST_MAX);

  if (upcoming.length) {
    box.appendChild(el('div', 'sec', 'นัดของฉัน'));
    upcoming.forEach(function (a) { box.appendChild(buildApptCard(a, false)); });
  }

  if (history.length) {
    box.appendChild(el('div', 'sec', 'ประวัติการจอง'));
    (histOpen ? history : history.slice(0, HIST_SHOW))
      .forEach(function (a) { box.appendChild(buildApptCard(a, true)); });

    if (history.length > HIST_SHOW) {
      box.appendChild(button('mini hist-more',
        histOpen ? 'ย่อประวัติ' : 'ดูเพิ่ม (อีก ' + (history.length - HIST_SHOW) + ' รายการ)',
        function () { histOpen = !histOpen; renderAppts(); }));
    }
  }
}

/* =====================================================
   10) ปฏิทินเลือกวันที่
   ===================================================== */
function renderCalendar() {
  const box = $('slotList');
  box.textContent = '';
  if (!slots.length) {
    box.appendChild(el('div', 'hint', 'ตอนนี้ยังไม่มีวันที่เปิดให้จอง'));
    return;
  }

  const byKey = {}, booked = {};
  slots.forEach(function (s) { byKey[s.key] = s; });
  appts.forEach(function (a) { booked[a.key] = true; });
  Object.keys(selected).forEach(function (k) {
    if (!byKey[k] || booked[k] || byKey[k].full) delete selected[k];
  });

  const keys = slots.map(function (s) { return s.key; }).sort();
  const minYM = keys[0].slice(0, 7), maxYM = keys[keys.length - 1].slice(0, 7);
  if (calM < 0) {
    const f = Object.keys(selected).sort()[0] || keys[0];
    calY = +f.slice(0, 4); calM = +f.slice(5, 7) - 1;
  }
  const ym = calY + '-' + pad2(calM + 1);

  // หัวปฏิทิน
  const cal = el('div', 'cal');
  const head = el('div', 'cal-head');
  const prev = button('cal-nav', '‹', function () { calM--; if (calM < 0) { calM = 11; calY--; } renderCalendar(); });
  const next = button('cal-nav', '›', function () { calM++; if (calM > 11) { calM = 0; calY++; } renderCalendar(); });
  prev.setAttribute('aria-label', 'เดือนก่อนหน้า');
  next.setAttribute('aria-label', 'เดือนถัดไป');
  prev.disabled = ym <= minYM;
  next.disabled = ym >= maxYM;
  head.appendChild(prev);
  head.appendChild(el('div', 'cal-title', MONTHS[calM] + ' ' + calY));
  head.appendChild(next);
  cal.appendChild(head);

  const dow = el('div', 'cal-dow');
  ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(function (d) { dow.appendChild(el('span', '', d)); });
  cal.appendChild(dow);

  // ตารางวัน
  const grid = el('div', 'cal-grid');
  const first = new Date(calY, calM, 1).getDay();
  const total = new Date(calY, calM + 1, 0).getDate();
  const today = todayBkk();
  for (let i = 0; i < first; i++) grid.appendChild(el('span'));
  for (let d = 1; d <= total; d++) {
    const key = calY + '-' + pad2(calM + 1) + '-' + pad2(d);
    const s = byKey[key];
    const b = button('cal-day');
    b.appendChild(el('span', 'dn', String(d)));
    if (key === today) b.classList.add('today');
    if (s) {
      if (s.lesson) b.appendChild(el('span', 'dl', s.lesson));
      b.classList.add('has');
      if (booked[key]) b.classList.add('booked');
      else if (s.full) b.classList.add('full');
      if (selected[key]) b.classList.add('sel');
      if (key === calDay) b.classList.add('active');
      b.setAttribute('aria-pressed', String(!!selected[key]));
      b.setAttribute('aria-label', d + (s.lesson ? ' ' + s.lesson : ''));
      b.onclick = function () {
        calDay = key;
        if (!booked[key] && !s.full) {   // กดเพื่อเลือก / กดซ้ำเพื่อยกเลิก
          if (selected[key]) delete selected[key]; else selected[key] = true;
        }
        renderCalendar();
      };
    } else {
      b.disabled = true;
    }
    grid.appendChild(b);
  }
  cal.appendChild(grid);
  box.appendChild(cal);

  // รายละเอียดวันที่กดล่าสุด (ไม่มีปุ่มเลือกแล้ว)
  const day = byKey[calDay];
  if (day) {
    const det = el('div', 'cal-detail');
    det.appendChild(el('div', 'd-date', '📅 ' + day.label));
    if (day.lesson) { const l = el('div', 'd-lesson'); softText(l, day.lesson); det.appendChild(l); }
    det.appendChild(el('div', 'd-time', '🕓 ' + TIME_TEXT));
    const isBooked = !!booked[day.key], isFull = !isBooked && day.full;
    const low = !isBooked && !isFull && day.left <= 5;
    det.appendChild(el('span', 'c-seat' + (low ? ' low' : '') + (isBooked || isFull ? ' off' : ''),
      isBooked ? '✓ จองแล้ว' : isFull ? 'เต็มแล้ว' : 'เหลือ ' + day.left + ' ที่นั่ง'));
    if (selected[day.key]) det.appendChild(el('span', 'c-seat sel-tag', '✓ เลือกวันนี้แล้ว'));
    box.appendChild(det);
  } else {
    box.appendChild(el('div', 'cal-hint', 'กดที่วันที่เพื่อเลือก (กดซ้ำเพื่อยกเลิก) วงกลมสีม่วงเข้ม = เลือกแล้ว'));
  }

  // วันที่ที่เลือกไว้
  const picked = Object.keys(selected).sort();
  if (picked.length) {
    const wrap = el('div', 'cal-picked');
    picked.forEach(function (k) {
      const t = el('span', 'tag', byKey[k].label);
      const x = button('', '×', function () { toggleDate(k); });
      x.setAttribute('aria-label', 'เอาวันที่ ' + byKey[k].label + ' ออก');
      t.appendChild(x);
      wrap.appendChild(t);
    });
    box.appendChild(wrap);
  }
}

function toggleDate(key) {
  if (selected[key]) delete selected[key]; else selected[key] = true;
  renderCalendar();
}

/* =====================================================
   11) จอง / ยกเลิก
   ===================================================== */
// สลับหน้าในกล่องจอง: 1 = เลือกวันที่, 2 = เลือกรูปแบบ
function setBookStep(n, animate) {
  $('bookStep1').style.display = n === 1 ? 'block' : 'none';
  $('bookStep2').style.display = n === 2 ? 'block' : 'none';
  setBMsg('');

  if (n === 2) { // สรุปวันที่ที่เลือกไว้
    const keys = Object.keys(selected).sort();
    const sum = $('bookSummary');
    sum.textContent = '';
    sum.appendChild(el('div', 'sum-title', 'วันที่เลือก ' + keys.length + ' วัน'));
    const list = el('div', 'sum-list');
    keys.forEach(function (k) { list.appendChild(el('span', '', labelFor(k))); });
    sum.appendChild(list);
  }

  if (animate !== false && !reduceMotion()) {
    const page = $(n === 2 ? 'bookStep2' : 'bookStep1');
    page.classList.remove('slide-r', 'slide-l');
    void page.offsetWidth; // ทำให้อนิเมชันเริ่มใหม่ทุกครั้ง
    page.classList.add(n === 2 ? 'slide-r' : 'slide-l');
  }
}

function goStep2() {
  if (!Object.keys(selected).length) {
    setBMsg('กรุณากดเลือกวันที่อย่างน้อย 1 วัน', 'err');
    return;
  }
  setBookStep(2);
  try { $('bookBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
}

function closeBook() {
  document.querySelectorAll('input[name=btype]').forEach(function (r) { r.checked = false; });
  setBookStep(1, false);
  setBMsg('');
  // ซ่อนปุ่มตาในหน้า login กลับเป็นแบบยังไม่พิมพ์ (ฟังก์ชันนี้ถูกเรียกตอนออกจากระบบด้วย)
  document.querySelectorAll('.pw-wrap').forEach(function (w) { w.classList.remove('has-text'); });
}

function selectedType() {
  const r = document.querySelector('input[name=btype]:checked');
  return r ? r.value : '';
}

function allBooked(keys, type, list) {
  return keys.every(function (k) {
    return list.some(function (a) { return a.key === k && a.type === type; });
  });
}

function placeNote(type) {
  return type === 'onsite' && onsite.place ? '📍 สถานที่: ' + onsite.place : '';
}

function doBook() {
  const keys = Object.keys(selected).sort();
  const type = selectedType();
  if (!keys.length) { setBMsg('กรุณากดเลือกวันที่อย่างน้อย 1 วัน', 'err'); return; }
  if (!type) { setBMsg('กรุณาเลือก Onsite หรือ Online', 'err'); return; }
  setBMsg('');
  setAMsg('');

  showDialog({
    icon: type === 'online' ? '💻' : '🏫',
    title: 'ยืนยันการจอง',
    message: 'จองนัด ' + typeName(type) + ' จำนวน ' + keys.length + ' วัน เวลา ' + TIME_TEXT,
    lines: keys.map(labelFor),
    note: placeNote(type),
    buttons: [
      { text: 'แก้ไข', cls: 'ghost' },
      { text: 'ยืนยันจอง', cls: 'primary', focus: true, onClick: function () { submitBook(keys, type); } }
    ]
  });
}

function submitBook(keys, type) {
  const btn = $('submitBook');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'กำลังจอง...';
  setBMsg('');
  setAMsg('');

  runRetry('bookAppointment', [token, keys, type], {
    onWait: function (n) {
      btn.textContent = 'กำลังต่อคิว... (' + n + ')';
      setBMsg('ตอนนี้มีคนจองจำนวนมาก ระบบกำลังต่อคิวให้ กรุณารอสักครู่และอย่าปิดหน้านี้', 'info');
    },
    done: function (res, err) {
      btn.disabled = false;
      btn.textContent = 'ยืนยันการจอง';

      if (handleReply(res, err, setBMsg, {
        fail: 'เชื่อมต่อไม่สำเร็จ หากไม่แน่ใจว่าจองแล้วหรือยัง ให้ออกจากระบบแล้วเข้าใหม่เพื่อดู "นัดของฉัน"',
        busy: 'ตอนนี้มีคนจองจำนวนมากมาก ยังต่อคิวไม่สำเร็จ กรุณากดยืนยันการจองอีกครั้งในอีกสักครู่'
      })) return;

      let ok = !!res.ok;
      let labels = res.labels;
      if (!ok && res.appts && allBooked(keys, type, res.appts)) {
        ok = true;
        labels = keys.map(labelFor);
      }

      if (!ok) {
        renderAppts();
        renderCalendar();
        setBMsg(res.message || 'จองไม่สำเร็จ ลองใหม่อีกครั้ง', 'err');
        return;
      }

      selected = {};
      calDay = '';
      closeBook();
      renderAppts();
      renderCalendar();

      const remind = type === 'onsite' ? ' อย่าลืมมาตามนัดนะ 🙂' : '';
      setAMsg('จองนัด ' + typeName(type) + ' เรียบร้อย: ' + (labels || []).join(', ') + remind +
              ' ดูรายละเอียดได้ที่ "นัดของฉัน" ด้านล่าง', 'ok');
      showTab('appts');

      showDialog({
        icon: '🎉',
        title: 'จองสำเร็จ',
        message: 'จองนัด ' + typeName(type) + ' เรียบร้อยแล้ว' + remind,
        lines: labels || [],
        note: placeNote(type),
        link: type === 'onsite' ? { text: '🗺️ เปิดแผนที่', href: onsite.mapUrl } : null,
        buttons: [{ text: 'OK', cls: 'primary' }]
      });
    }
  });
}

function askCancel(a) {
  showDialog({
    icon: '🗑️',
    title: 'ยกเลิกนัด',
    message: 'ยกเลิกนัดวันที่ ' + a.label + ' (' + typeName(a.type) + ') ใช่ไหม?',
    buttons: [
      { text: 'ไม่ยกเลิก', cls: 'ghost', focus: true },
      { text: 'ยืนยันยกเลิก', cls: 'danger', onClick: function () { doCancel(a.key); } }
    ]
  });
}

function doCancel(key) {
  if (busy) return;
  busy = true;
  const label = labelFor(key);
  setAMsg('กำลังยกเลิก...', 'info');
  setBMsg('');

  runRetry('cancelAppointment', [token, key], {
    onWait: function (n) {
      setAMsg('ตอนนี้มีผู้ใช้งานจำนวนมาก ระบบกำลังต่อคิวให้ (' + n + ')...', 'info');
    },
    done: function (res, err) {
      busy = false;

      if (handleReply(res, err, setAMsg, {
        fail: 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง',
        busy: 'ตอนนี้มีผู้ใช้งานจำนวนมากมาก ยังต่อคิวไม่สำเร็จ กรุณากดยกเลิกอีกครั้งในอีกสักครู่'
      })) return;

      const ok = !!res.ok || (res.appts && !res.appts.some(function (a) { return a.key === key; }));
      renderAppts();
      renderCalendar();
      if (ok) setAMsg('ยกเลิกนัดวันที่ ' + (res.label || label) + ' เรียบร้อยแล้ว', 'ok');
      else setAMsg(res.message || 'ยกเลิกไม่สำเร็จ ลองใหม่อีกครั้ง', 'err');
    }
  });
}

/* =====================================================
   12) เริ่มต้นระบบ (รันครั้งเดียวตอนเปิดหน้า)
   ===================================================== */

// ป๊อปอัป: คลิกพื้นหลังปิด / Esc ปิด / Tab วนอยู่ในหน้าต่าง
$('dlg').addEventListener('click', function (e) {
  if (e.target === $('dlg')) closeDialog();
});
document.addEventListener('keydown', function (e) {
  const ov = $('dlg');
  if (!ov.classList.contains('open') || ov.classList.contains('closing')) return;
  if (e.key === 'Escape') { closeDialog(); return; }
  if (e.key === 'Tab') {
    const bs = ov.querySelectorAll('button, a[href]');
    if (!bs.length) return;
    const first = bs[0], last = bs[bs.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// กด Enter ในช่องกรอกเพื่อเข้าสู่ระบบ
['sid', 'email'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
});
  
// แสดงปุ่มตาเมื่อเริ่มพิมพ์ ซ่อนเมื่อช่องว่าง
['sid', 'email'].forEach(function (id) {
  $(id).addEventListener('input', function () {
    this.parentNode.classList.toggle('has-text', this.value.length > 0);
    if (!this.value) {
      this.type = 'password';
      this.nextElementSibling.textContent = '👁';
    }
  });
});

// เช็กสถานะปิดปรับปรุงตอนเปิดหน้า และเช็กซ้ำทุก 60 วินาที
checkStatus();
setInterval(checkStatus, 60000);

// refresh แล้วกลับเข้าหน้าหลักทันทีถ้ามี session ค้างอยู่ในแท็บนี้
(function () {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.token || !s.name) return;
    showHome({ token: s.token, student: { name: s.name }, links: s.links, notes: s.notes,
               onsite: s.onsite, slots: s.slots, appts: s.appts });
  } catch (e) { clearSession(); }
})();

// ฉากหลังหน้า login: สัญลักษณ์คณิตศาสตร์ลอยขึ้น
(function () {
  const S = ['∑', 'π', '√', 'cos', '∞', '≈', 'x²', 'θ', 'Δ', '±', '%', '÷', 'f(x)', 'sin', '∠', 'tan', 'y', 'x', 'y²'];
  for (let i = 0; i < 18; i++) {
    const e = el('span', 'sym', S[i % S.length]);
    e.style.left = (Math.random() * 96) + '%';
    e.style.fontSize = (18 + Math.random() * 28) + 'px';
    e.style.animationDuration = (14 + Math.random() * 14) + 's';
    e.style.animationDelay = (-Math.random() * 20) + 's';
    $('fx').appendChild(e);
  }
})();

// การ์ด login เอียงตามเมาส์ (เฉพาะจอที่มีเมาส์)
(function () {
  if (reduceMotion() || !matchMedia('(hover: hover)').matches) return;
  const card = $('loginCard');
  function tilt(rx, ry) {
    card.style.setProperty('--rx', rx + 'deg');
    card.style.setProperty('--ry', ry + 'deg');
  }
  document.addEventListener('mousemove', function (e) {
    if ($('loginBox').style.display === 'none') return;
    tilt((-((e.clientY / window.innerHeight) - .5) * 6).toFixed(2),
         (((e.clientX / window.innerWidth) - .5) * 8).toFixed(2));
  });
  document.addEventListener('mouseleave', function () { tilt(0, 0); });
})();

// intro: Check -> Point -> จางหายเข้าหน้า login (แตะเพื่อข้ามได้)
(function () {
  const lb = $('loginBox');
  if (token || reduceMotion()) { lb.classList.add('enter'); return; }

  const ti = el('div'); ti.id = 'textIntro'; ti.setAttribute('aria-hidden', 'true');
  const words = el('div', 'ti-words');
  [['Check', 0.1], ['Point', 0.55]].forEach(function (w) {
    const mask = el('span', 'ti-mask');
    const word = el('span', 'ti-in', w[0]);
    word.style.setProperty('--d', w[1] + 's');
    mask.appendChild(word);
    words.appendChild(mask);
  });
  ti.appendChild(words);
  ti.appendChild(el('div', 'ti-skip', 'แตะเพื่อข้าม'));
  document.body.appendChild(ti);

  let revealed = false;
  let timer = setTimeout(function () { reveal(400); }, 1500);

  function reveal(ms) {
    if (revealed) return;
    revealed = true;
    clearTimeout(timer);
    lb.classList.add('enter');
    ti.style.transitionDuration = ms + 'ms';
    ti.classList.add('tiOut');
    setTimeout(function () { if (ti.parentNode) ti.parentNode.removeChild(ti); }, ms + 80);
  }
  ti.addEventListener('click', function () { reveal(250); });
})();
</script>
